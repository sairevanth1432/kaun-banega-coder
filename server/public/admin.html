<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KBC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* KBC admin console: the game's studio identity (deep violet + gold) turned into a calm working tool.
   Violet control-room sidebar, light worksurface (dark when the OS asks), gold reserved for the primary action and the current page. */
:root{
  --bg:#F4F2FA;--panel:#FFFFFF;--panel2:#FBFAFE;--well:#F7F5FC;--line:#E4E0F0;--line2:#CEC7E4;
  --muted:#77709A;--soft:#4F4870;--text:#1B1433;
  --accent:#7B4DFF;--accent-ink:#FFFFFF;--accent-soft:#EFE9FF;
  --gold:#FFC83D;--gold-2:#FF9F1C;--gold-ink:#241500;--gold-edge:#C47D10;--gold-txt:#A86300;
  --bad:#D92D4F;--bad-soft:#FDECEF;--good:#16884A;--good-soft:#E6F6EC;--info:#2B6FD6;--info-soft:#E8F0FD;--violet:#7B4DFF;--warn-soft:#FFF5DB;
  --side:#160B38;--side-2:#22134F;--side-line:rgba(255,255,255,.1);--side-text:#E6DEFF;--side-muted:#9C90C9;
  --hover:#F1EDFB;--shadow:0 1px 2px rgba(27,20,51,.06),0 8px 24px -16px rgba(27,20,51,.25);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D0820;--panel:#160E31;--panel2:#1C1340;--well:#0F0926;--line:#2A2052;--line2:#3B2F6E;
  --muted:#9187BD;--soft:#C3B9EA;--text:#F3EFFF;
  --accent:#A98BFF;--accent-ink:#140A33;--accent-soft:#2A1D5C;--gold-txt:#FFD66B;
  --bad:#FF7A92;--bad-soft:#3A1226;--good:#4ADE80;--good-soft:#0F2E22;--info:#8EC5FF;--info-soft:#132A4A;--violet:#B79CFF;--warn-soft:#33260A;
  --side:#0A0518;--side-2:#1A0F40;--hover:#1F1646;--shadow:0 10px 30px -18px rgba(0,0,0,.8);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:700}
code{font-family:var(--f-mono);font-size:.92em}
[hidden]{display:none !important}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side-2),var(--side) 55%);color:var(--side-text);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.1;color:#fff}
.brand::before{content:"{₹}";flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--gold-ink);
  background:radial-gradient(circle at 35% 30%,#FFF1B8,var(--gold) 45%,#C9770C);box-shadow:0 0 0 4px rgba(255,200,61,.16)}
.brand span{color:var(--gold)}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--side-text);font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:linear-gradient(120deg,var(--gold),var(--gold-2));color:var(--gold-ink);font-weight:800;box-shadow:0 3px 0 var(--gold-edge)}
.nav .sep{height:1px;background:var(--side-line);margin:8px 6px}
.nav .grp{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:12px 12px 4px}
.nav .grp:first-child{padding-top:0}
.badge{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#FF5A7A;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side > a.btn{border-color:var(--side-line);color:var(--side-text);background:rgba(255,255,255,.04)}
.side > a.btn:hover{border-color:var(--gold);color:var(--gold)}
.me{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--side-line)}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.me span{color:var(--side-muted);font-size:12px;overflow-wrap:anywhere}
.me .btn{color:var(--side-text);border-color:var(--side-line)}
main{padding:28px 36px 60px;min-width:0}
h1{margin:0;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0 0 14px;font-size:15px;font-weight:800}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{margin:8px 0 0;color:var(--soft);max-width:760px;line-height:1.55}
.kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border-radius:16px;padding:18px 20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat{position:relative;overflow:hidden}
.stat .k{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.g4 .stat:first-child{background:linear-gradient(140deg,var(--side-2),var(--side));border-color:transparent;color:#fff}
.g4 .stat:first-child .k,.g4 .stat:first-child .s{color:var(--side-muted)}
.g4 .stat:first-child .v{color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex-grow:1}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{
  min-height:40px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--text);outline:none}
textarea{padding:10px 12px;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:280px}
input[type=number]{width:110px}
input[type=checkbox]{accent-color:var(--accent)}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:linear-gradient(120deg,var(--gold),var(--gold-2));border-color:transparent;color:var(--gold-ink);font-weight:800;box-shadow:0 3px 0 var(--gold-edge)}
.btn.pri:hover{filter:brightness(1.05);color:var(--gold-ink)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-edge)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{min-height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--panel);color:var(--soft);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 260px);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--well);color:var(--soft);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--gold-txt)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.violet{background:var(--accent-soft);color:var(--violet)}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--soft)}
.field small{color:var(--muted);font-size:12px}
.note{padding:12px 14px;border-radius:12px;background:var(--well);border:1px solid var(--line);color:var(--soft);line-height:1.55}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--gold-txt)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
pre.code{margin:0;padding:12px 14px;background:#140A33;color:#E9E3FF;border-radius:10px;white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.5;max-height:360px;overflow:auto}
.drawer-back{position:fixed;inset:0;background:rgba(13,8,32,.55);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(980px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:24px 26px 60px;display:flex;flex-direction:column;gap:16px;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5)}
.toast{position:fixed;right:20px;bottom:20px;z-index:80;max-width:520px;padding:12px 16px;border-radius:12px;background:var(--side);color:#fff;border-left:4px solid var(--good);font-weight:700;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
.toast.err{border-left-color:#FF5A7A}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,#3A1A86 0%,#1A0D3D 45%,#0B0620 100%)}
.auth{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.auth > div:first-child .brand{font-size:22px!important;padding:0!important}
.auth > div:first-child .brand::before{width:52px;height:52px;font-size:14px}
.auth > div:first-child .kicker{color:#C9B8FF}
.auth .card{display:flex;flex-direction:column;gap:14px;padding:24px;box-shadow:0 30px 60px -24px rgba(0,0,0,.6)}
.auth > p.muted{color:#C9B8FF}
.auth > p.muted a{color:var(--gold)}
.auth input{width:100%}
.qr{background:#fff;border-radius:12px;padding:10px;width:200px;height:200px}
.qr svg{width:100%;height:100%;display:block}
.secret{font-family:var(--f-mono);font-size:18px;font-weight:700;letter-spacing:2px;word-break:break-all;color:var(--accent)}
.opt{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.picked{background:var(--warn-soft)}
.opt.wrong{border-color:var(--bad)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.bulk{position:sticky;bottom:16px;z-index:5;margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--side);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
.bulk .btn:not(.pri){background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.optin{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.optin input[type=radio]{width:20px;height:20px;accent-color:var(--good)}
.dist{display:flex;gap:3px;align-items:flex-end;height:30px;width:88px}
.dist span{flex:1;border-radius:2px 2px 0 0;background:var(--line2);min-height:2px}
.dist span.c{background:var(--good)}
/* Live preview in the game's look (play.html) */
.kbc{border-radius:20px;padding:20px;background:radial-gradient(120% 100% at 50% 0%,#2A1460 0%,#140A33 60%,#0B0620 100%);border:1px solid #3B2A7A;font-family:var(--f-body);position:sticky;top:0}
.kbc .meta{display:flex;justify-content:space-between;color:#C9B8FF;font-size:12px;font-weight:700;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.kbc .qcard{background:linear-gradient(180deg,#24124F,#1A0D3D);border:2px solid #FFC83D;border-radius:16px;padding:16px 18px;color:#fff;font-weight:700;font-size:16px;line-height:1.45;white-space:pre-wrap}
.kbc pre{margin:12px 0 0;padding:12px;border-radius:10px;background:#0B0620;color:#E9E3FF;font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;line-height:1.5}
.kbc .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kbc .o{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:999px;border:2px solid #4B3A8F;background:#1B0E40;color:#fff;font-weight:600;font-size:14px;min-height:46px}
.kbc .o b{color:#FFC83D;font-weight:800}
.kbc .o.right{border-color:#4ADE80;background:#0F3B26}
.kbc .x{margin-top:12px;font-size:13px;color:#C9B8FF;line-height:1.5}
.kbc .x b{color:#FFC83D}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.kbc{position:static}}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 16px}input[type=search]{min-width:0;width:100%}.kbc .opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------------ helpers (from saturday-sprint admin.html)
  var root = document.getElementById('root');
  var ME = null, VIEW = (location.hash || '#overview').slice(1), CACHE = {};
  var LADDER = null;   // the money board, loaded once per boot (Ladder & pools refreshes it)

  function chips(options, value, pick, label) {
    var g = h('div', { class: 'chips' }, options.map(function (o) {
      var b = h('button', { type: 'button', onclick: function () { pick(o[0]); } }, o[1]);
      b.setAttribute('aria-pressed', String(o[0]) === String(value) ? 'true' : 'false');
      return b;
    }));
    g.setAttribute('role', 'group'); g.setAttribute('aria-label', label || 'Filter');
    return g;
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'html') el.innerHTML = v; // only used for server-generated SVG
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  // Replaces el's children; like h(), it flattens arrays and skips null/false.
  function put(el) { el.replaceChildren(); for (var i = 1; i < arguments.length; i++) add(el, arguments[i]); return el; }
  function add(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(function (k) { add(el, k); });
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  function api(method, url, body) {
    var init = { method: method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(body); }
    return fetch(url, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401 && url.indexOf('/api/admin/login') !== 0) { ME = null; loginScreen(); throw Object.assign(new Error('Session expired. Log in again.'), { silent: true }); }
        if (!r.ok) throw Object.assign(new Error(d.message || 'Request failed (' + r.status + ')'), d);
        return d;
      });
    }, function () { throw new Error('No connection to the server.'); });
  }
  var toastT;
  function toast(msg, err) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = h('div', { class: 'toast' + (err ? ' err' : ''), role: err ? 'alert' : 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, err ? 7000 : 3500);
  }
  function fail(e) { if (!e.silent) toast(e.message, true); }
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var dt = function (ms) { if (!ms) return '–'; var d = new Date(ms); return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var secs = function (s) { if (s == null) return '–'; s = Math.round(s); return Math.floor(s / 60) + ':' + pad(s % 60); };
  var rupees = function (n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); };
  var isSuper = function () { return ME && ME.role === 'super_admin'; };
  function pill(text, kind) { return h('span', { class: 'pill ' + (kind || '') }, text); }
  function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }
  function download(url) { var a = h('a', { href: url, download: '' }); document.body.appendChild(a); a.click(); a.remove(); }
  function localInput(ms) { var d = new Date(ms); if (isNaN(d)) return ''; return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function th(list) { return h('thead', null, h('tr', null, list.map(function (t) { return Array.isArray(t) ? h('th', { class: t[1] }, t[0]) : h('th', null, t); }))); }
  function stat(k, v, sub) { return h('div', { class: 'card stat' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), sub ? h('div', { class: 's' }, sub) : null); }
  function pager(d, onPage) {
    var pages = Math.max(1, Math.ceil(d.total / d.size));
    return h('div', { class: 'pager' }, h('span', { class: 'muted' }, d.total.toLocaleString('en-IN') + ' total · page ' + d.page + ' of ' + pages),
      h('button', { class: 'btn sm', disabled: d.page <= 1, onclick: function () { onPage(d.page - 1); } }, '← Prev'),
      h('button', { class: 'btn sm', disabled: d.page >= pages, onclick: function () { onPage(d.page + 1); } }, 'Next →'));
  }
  // A file the admin picked → { csv } or { xlsxBase64 } for the import APIs.
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onerror = function () { reject(new Error('Could not read the file.')); };
      if (/\.xlsx$/i.test(file.name)) { r.onload = function () { resolve({ xlsxBase64: String(r.result).split(',')[1], filename: file.name }); }; r.readAsDataURL(file); }
      else { r.onload = function () { resolve({ csv: String(r.result), filename: file.name }); }; r.readAsText(file); }
    });
