<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kaun Banega Coder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#030B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: solo quiz-show app over a live 3D studio (gold coin + rings, drifting gems, particles). Home → Fastest Finger First → hot seat (HUD, question, 2×2 answers, ladder) → result card. KBC palette: navy + royal blue + gold, sky accent. Single dark theme. */
:root{
  --bg:#060B18; --fg:#F2F5FF; --muted:#A5AFCC;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.1); --stroke:rgba(255,255,255,.13); --stroke-2:rgba(255,255,255,.24);
  --edge:#0B1636; --deep:#0F1D44;
  --gold:#FFC83D; --gold-2:#FF9F1C; --gold-edge:#B5650A; --gold-txt:#FFD66B; --gold-ink:#241500;
  --ok:#22C55E; --ok-2:#4ADE80; --ok-edge:#15803D; --ok-ink:#03200D;
  --bad:#F43F5E; --bad-2:#FB7185; --bad-edge:#9F1239; --bad-ink:#2A030B;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);min-height:100%}
body{font:17px/1.5 var(--f-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
pre,code,.code,.opt .t{font-variant-ligatures:none}

/* Background: CSS aurora (always) + three.js scene (when available) */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 15% 0%,rgba(40,87,217,.55),transparent 70%),radial-gradient(ellipse 50% 45% at 90% 20%,rgba(56,95,202,.5),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 110%,rgba(28,131,175,.35),transparent 70%),var(--bg)}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .8s}
body.inplay #bg3d{opacity:.5}
.wrap{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1360px;margin:0 auto}

/* Glass card */
.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 60px -24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font:600 13px/1 var(--f-body);color:var(--fg)}
.chip.gold{background:linear-gradient(120deg,var(--gold),var(--gold-2));color:var(--gold-ink);border-color:transparent;box-shadow:0 3px 0 var(--gold-edge)}
.muted{color:var(--muted)}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.icon3d{--s:42px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);display:grid;place-items:center;background:linear-gradient(145deg,#FFE7A0,var(--gold) 45%,var(--gold-2));box-shadow:0 5px 0 var(--gold-edge),0 12px 26px rgba(255,159,28,.35),inset 0 2px 0 rgba(255,255,255,.6);font:800 calc(var(--s)*.36)/1 var(--f-mono);color:var(--gold-ink);letter-spacing:-.06em}
.brand b{font:700 19px/1 var(--f-display);letter-spacing:-.02em}
.brand b span{color:var(--gold-txt)}
.tools{display:flex;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);font:600 13.5px var(--f-body);color:var(--muted);backdrop-filter:blur(12px);transition:color .2s,background .2s}
.tbtn:hover{color:var(--fg);background:var(--glass-2)}
.tbtn svg{width:16px;height:16px}
.tbtn.off{opacity:.55}

/* Buttons with depth */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:16px;font:700 16px var(--f-body);background:linear-gradient(180deg,#243E86,#12265E);border:1px solid rgba(255,255,255,.14);box-shadow:0 5px 0 var(--edge),0 14px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 6px 14px rgba(0,0,0,.3)}
.btn.gold{background:linear-gradient(180deg,#FFD866,var(--gold) 40%,var(--gold-2));color:var(--gold-ink);border-color:rgba(255,255,255,.35);box-shadow:0 5px 0 var(--gold-edge),0 16px 34px rgba(255,159,28,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-edge),0 6px 14px rgba(255,159,28,.3)}
.btn.quiet{background:transparent;box-shadow:none;border-color:var(--stroke);color:var(--muted);font-weight:600}
.btn.quiet:hover{color:var(--fg)}
.btn:disabled{opacity:.45}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:min(36vh,310px)}
.title3d{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.9}
.title3d span{font:700 clamp(22px,3vw,34px)/1 var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:#E3EAFF;padding-left:.32em;margin-bottom:10px;text-shadow:0 4px 18px rgba(40,87,217,.8)}
.title3d b{font:800 clamp(80px,13vw,176px)/.9 var(--f-display);letter-spacing:-.05em;color:var(--gold);text-shadow:0 1px 0 #F2B630,0 2px 0 #E5A422,0 3px 0 #D59318,0 4px 0 #C2800F,0 5px 0 #AC6C08,0 6px 0 #955A04,0 7px 0 #7E4A02,0 20px 30px rgba(0,0,0,.55),0 0 80px rgba(255,159,28,.35);animation:titleFloat 6s ease-in-out infinite}
@keyframes titleFloat{50%{transform:translateY(-8px) rotateX(6deg)}}
.sub{margin:0;max-width:52ch;color:#D2DBF5;font-size:clamp(16px,1.5vw,19px)}
.join{display:flex;flex-direction:column;gap:10px;padding:18px;width:min(520px,100%);text-align:left}
.join label{font:600 13px var(--f-body);color:var(--gold-txt)}
.join .row{display:flex;gap:10px;flex-wrap:wrap}
.join .row .btn{flex:1 1 180px}
.join input{flex:1 1 100%;min-width:0;background:rgba(2,5,15,.55);border:1px solid var(--stroke-2);border-radius:14px;color:var(--fg);padding:13px 16px;font:500 17px var(--f-body)}
.join small{color:var(--muted);font-size:13.5px}
.best{font-size:14.5px;color:var(--muted)}
.best b{color:var(--gold-txt)}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:1060px;text-align:left;margin-top:8px}
@media (max-width:900px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.how{grid-template-columns:1fr}}
.how .card{padding:18px;border-radius:20px;transition:transform .3s}
.how .card:hover{transform:translateY(-4px) rotateX(4deg)}
.how .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--f-display);background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-edge);margin-bottom:12px}
.how b{display:block;font:600 16.5px/1.25 var(--f-display);letter-spacing:-.02em;margin-bottom:4px}
.how span{font-size:14.5px;color:var(--muted)}
.lifes{width:100%;max-width:1060px;padding:20px;text-align:left}
.lifes h3{margin:0 0 14px;font:700 18px var(--f-display);letter-spacing:-.02em}
.lifes ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.lifes ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lifes ul{grid-template-columns:1fr}}
.lifes li{display:flex;gap:12px;align-items:flex-start}
.lifes li .lt{flex:none}
.lifes li b{display:block;font:600 15px var(--f-display);margin-bottom:2px}
.lifes li span{font-size:14px;color:var(--muted)}

/* Lifeline tile (3D) */
.lt{position:relative;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg,#234090,#12265E);border:1px solid rgba(255,255,255,.16);box-shadow:0 5px 0 var(--edge),0 12px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);font:800 14px/1 var(--f-display);letter-spacing:-.03em;color:var(--fg)}
.lt svg{width:24px;height:24px}
.ll{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0}
.ll .lt{transition:transform .15s,box-shadow .15s,color .2s}
.ll:hover:not(:disabled) .lt{transform:translateY(-3px) rotate(-4deg);color:var(--gold-txt);box-shadow:0 8px 0 var(--edge),0 0 0 3px rgba(255,200,61,.35),0 16px 30px rgba(0,0,0,.4)}
.ll:active:not(:disabled) .lt{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.ll .cap{font:600 12px/1 var(--f-body);color:var(--muted)}
.ll.used .lt{opacity:.32;transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.ll.used .lt::after{content:"";position:absolute;width:46px;height:3px;border-radius:2px;background:var(--bad-2);transform:rotate(-42deg)}
.ll.used .cap{text-decoration:line-through;opacity:.6}

/* Timer ring */
.clock{--p:1;--c:var(--gold);position:relative;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*360deg),rgba(255,255,255,.08) 0);box-shadow:0 0 50px rgba(255,200,61,.2),0 10px 0 rgba(4,11,30,.6)}
.clock::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#21397A,#0B132A 75%);box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.clock span{position:relative;font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.clock small{position:absolute;bottom:18px;font:600 10px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.clock.low{--c:var(--bad);box-shadow:0 0 50px rgba(244,63,94,.4),0 10px 0 rgba(4,11,30,.6);animation:pulse 1s infinite}
.clock.low span{color:var(--bad-2)}
@keyframes pulse{50%{transform:scale(1.06)}}

/* FFF */
.fff{max-width:960px;margin:22px auto 0;display:flex;flex-direction:column;gap:16px}
.fffhead{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 24px}
.fffhead h2{margin:10px 0 4px;font:700 clamp(22px,2.4vw,30px)/1.2 var(--f-display);letter-spacing:-.025em}
.fffhead p{margin:0}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.lines{grid-template-columns:1fr}}
.lineTile{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--stroke);box-shadow:0 6px 0 var(--edge),0 16px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px);transition:transform .15s,box-shadow .15s,opacity .2s}
.lineTile:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(255,200,61,.6)}
.lineTile:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.lineTile .key{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;font:700 15px var(--f-display);background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--gold-txt)}
.lineTile pre.code{margin:0;flex:1;min-width:0;max-width:none;padding:10px 14px;font:500 16px/1.4 var(--f-mono);white-space:pre;overflow-x:auto}
.lineTile.picked{opacity:.45;transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.lineTile .ord{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-display);background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-edge);opacity:1}
.tray{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.slots{display:flex;gap:8px;flex:1 1 auto}
.slotb{width:52px;height:52px;border-radius:14px;border:2px dashed var(--stroke-2);background:transparent;font:800 20px var(--f-display);color:var(--muted)}
.slotb.filled{border-style:solid;border-color:transparent;background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-edge);animation:dropIn .35s cubic-bezier(.2,1.5,.3,1)}
@keyframes dropIn{from{transform:translateY(-14px) scale(.7)}}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 22px}
.verdict b{font:700 20px var(--f-display);letter-spacing:-.02em}
.verdict.ok{border-color:rgba(74,222,128,.45)}.verdict.ok b{color:var(--ok-2)}
.verdict.bad{border-color:rgba(251,113,133,.45)}.verdict.bad b{color:var(--bad-2)}
.code .k{color:var(--gold-txt)}.code .s{color:#86EFAC}.code .n{color:#FDA4AF}

/* Play */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-top:18px}
.lifelines{display:flex;gap:10px;flex-wrap:wrap}
.me{justify-self:end;display:flex;align-items:center;gap:12px;text-align:right}
.me b{display:block;font:600 16px/1.15 var(--f-display);letter-spacing:-.02em}
.me small{font-size:13px;color:var(--muted)}
.me small b{display:inline;font:700 13px var(--f-body);color:var(--gold-txt)}
.ava{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font:800 20px var(--f-display);background:linear-gradient(145deg,#5C85F6,#2149B6);box-shadow:0 4px 0 var(--edge),0 0 0 2px rgba(255,200,61,.6)}
@media (max-width:760px){.hud{grid-template-columns:1fr auto}.me{display:none}.lifelines{gap:8px}.lt{width:50px;height:50px;border-radius:15px}.clock{width:80px;height:80px}.clock span{font-size:28px}.clock small{display:none}}
.dots{display:none;gap:5px;margin-top:14px}
.dots i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.dots i.done{background:var(--gold-2)}.dots i.cur{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dots i.safe:not(.done):not(.cur){background:rgba(255,200,61,.35)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;margin-top:16px;align-items:start;perspective:1400px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}.ladder{display:none!important}.dots{display:flex}}
.mainc{min-width:0;display:flex;flex-direction:column;gap:14px}
.qcard{padding:22px 26px 26px;text-align:center;border-radius:28px;animation:floaty 7s ease-in-out infinite;transform-style:preserve-3d}
@keyframes floaty{50%{transform:translateY(-5px) rotateX(1.5deg)}}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{margin:16px 0 0;font:600 clamp(22px,2.3vw,31px)/1.25 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
pre.code{margin:16px auto 0;max-width:640px;text-align:left;background:rgba(2,5,15,.6);border:1px solid var(--stroke);border-radius:16px;padding:14px 18px;font:500 clamp(15px,1.4vw,19px)/1.6 var(--f-mono);overflow-x:auto;white-space:pre;color:#E9EFFF;box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.slot{perspective:900px}
.slot.gone{visibility:hidden}
.opt{--rx:0deg;--ry:0deg;--y:0px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--stroke);backdrop-filter:blur(14px);box-shadow:0 7px 0 var(--edge),0 18px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.14);transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--y));transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .2s,border-color .2s;font:500 clamp(17px,1.6vw,20px)/1.3 var(--f-body)}
.opt:hover:not(:disabled){--y:-3px;border-color:var(--stroke-2);box-shadow:0 10px 0 var(--edge),0 24px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16)}
.opt .l{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font:700 15px/1 var(--f-display);background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--gold-txt)}
.opt .t{font-family:var(--f-mono);font-size:.92em;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.opt.pending{--y:-3px;border-color:rgba(255,200,61,.85);background:linear-gradient(180deg,rgba(255,200,61,.16),rgba(255,200,61,.05));box-shadow:0 10px 0 #4A2A07,0 0 0 4px rgba(255,200,61,.16),0 24px 40px rgba(0,0,0,.42)}
.opt.pending .l{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.opt.locked{--y:2px;background:linear-gradient(180deg,#FFD866,var(--gold) 45%,var(--gold-2));color:var(--gold-ink);border-color:rgba(255,255,255,.4);box-shadow:0 5px 0 var(--gold-edge),0 18px 40px rgba(255,159,28,.4)}
.opt.locked .l,.opt.right .l,.opt.wrong .l{background:rgba(0,0,0,.14);border-color:rgba(0,0,0,.2);color:inherit}
.opt.locked.suspense{animation:blink .3s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.2)}}
.opt.right{background:linear-gradient(180deg,#6EF0A0,var(--ok-2) 40%,var(--ok));color:var(--ok-ink);border-color:rgba(255,255,255,.4);box-shadow:0 7px 0 var(--ok-edge),0 18px 44px rgba(34,197,94,.45);animation:win .7s cubic-bezier(.2,1.5,.3,1)}
@keyframes win{40%{transform:translateY(-8px) scale(1.03) rotateX(8deg)}}
.opt.wrong{background:linear-gradient(180deg,#FDA4AF,var(--bad-2) 40%,var(--bad));color:var(--bad-ink);border-color:rgba(255,255,255,.35);box-shadow:0 7px 0 var(--bad-edge),0 18px 40px rgba(244,63,94,.35)}
.panelx{padding:16px 20px;display:flex;flex-direction:column;gap:10px;animation:panelIn .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) rotateX(-12deg)}}
.panelx h4{margin:0;display:flex;align-items:center;gap:8px;font:700 16px var(--f-display);color:var(--gold-txt)}
.panelx h4 svg{width:18px;height:18px}
.panelx p{margin:0}
.poll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;height:150px}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font:600 14px var(--f-mono)}
.pfill{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#FFD866,var(--gold-2));box-shadow:0 0 18px rgba(255,159,28,.35),inset 0 2px 0 rgba(255,255,255,.5);height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.pcol b{font:700 16px var(--f-display);color:var(--muted)}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:58px}
.ask{font:700 clamp(20px,2.2vw,26px) var(--f-display);letter-spacing:-.02em;color:var(--gold-txt)}
.ask.pulse{animation:askPulse 1s ease-in-out infinite}
@keyframes askPulse{50%{opacity:.5}}
.banner{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:18px;font:800 clamp(24px,2.8vw,34px)/1 var(--f-display);letter-spacing:-.03em;animation:pop .55s cubic-bezier(.2,1.5,.3,1)}
.banner.win{background:linear-gradient(180deg,#6EF0A0,var(--ok));color:var(--ok-ink);box-shadow:0 6px 0 var(--ok-edge),0 18px 40px rgba(34,197,94,.4)}
.banner.lose{background:linear-gradient(180deg,#FDA4AF,var(--bad));color:var(--bad-ink);box-shadow:0 6px 0 var(--bad-edge),0 18px 40px rgba(244,63,94,.35)}
@keyframes pop{from{transform:scale(.5) rotateX(50deg);opacity:0}}
.gain{font:800 clamp(22px,2.4vw,30px)/1 var(--f-display);color:var(--gold-txt);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.why{margin:0 auto;max-width:70ch;text-align:center;color:var(--muted)}
.why b{color:var(--fg)}

/* Ladder */
.ladder{list-style:none;margin:0;padding:14px 10px;display:flex;flex-direction:column;gap:3px;transform:rotateY(-8deg);transform-origin:left center}
.ladder li{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;font:600 16px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:background .3s}
.ladder li .no{font-size:12px;color:var(--muted);text-align:right}
.ladder li.done{color:var(--muted)}
.ladder li.done .no{color:var(--ok-2)}
.ladder li.safe:not(.cur):not(.done){color:var(--gold-txt)}
.ladder li .lk{font:600 10px/1 var(--f-body);padding:3px 7px;border-radius:999px;border:1px solid rgba(255,200,61,.45);color:var(--gold-txt)}
.ladder li.cur{background:linear-gradient(180deg,#FFD866,var(--gold) 45%,var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-edge),0 12px 26px rgba(255,159,28,.4);animation:climb .6s cubic-bezier(.2,1.5,.3,1)}
.ladder li.cur .no,.ladder li.cur .lk{color:var(--gold-ink);border-color:rgba(36,21,0,.35)}
@keyframes climb{from{transform:translateY(16px) scale(.9)}}
.ladder .cap{display:block;text-align:center;font:500 12px var(--f-body);color:var(--muted);padding:8px 0 2px}

/* Result */
.result{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:190px;text-align:center}
.rcard{position:relative;width:min(560px,100%);padding:28px;border-radius:30px;overflow:hidden;transform-style:preserve-3d;animation:cardIn .9s cubic-bezier(.2,1.2,.3,1)}
@keyframes cardIn{from{opacity:0;transform:rotateY(-35deg) translateY(30px)}}
.rcard::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,200,61,.18),transparent 30%);animation:sweep 6s linear infinite;pointer-events:none}
@keyframes sweep{to{transform:rotate(360deg)}}
.rcard>*{position:relative}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rname{margin:18px 0 2px;font:700 clamp(22px,2.6vw,28px) var(--f-display);letter-spacing:-.02em}
.rpts{font:800 clamp(56px,9vw,96px)/1 var(--f-display);letter-spacing:-.05em;color:var(--gold);text-shadow:0 1px 0 #E5A422,0 2px 0 #D59318,0 3px 0 #C2800F,0 4px 0 #AC6C08,0 5px 0 #955A04,0 16px 30px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.rpts small{font:700 .32em var(--f-display);letter-spacing:0;color:var(--gold-txt);text-shadow:none;margin-left:6px}
.rmsg{margin:6px 0 18px;color:#D5DEF7}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke)}
.stat b{display:block;font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.rcode{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:rgba(2,5,15,.5);border:1px dashed var(--stroke-2);font-size:13.5px;color:var(--muted)}
.rcode b{font:700 18px var(--f-mono);letter-spacing:.12em;color:var(--gold-txt)}
.ractions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Overlays */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.redflash{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,transparent 40%,rgba(244,63,94,.45));opacity:0}
.redflash.on{animation:fade .8s ease-out}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
.intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;align-content:center;gap:16px;background:rgba(6,11,24,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;pointer-events:none;perspective:900px}
.intro.on{opacity:1;visibility:visible}
.intro b{font:800 clamp(120px,18vw,210px)/.9 var(--f-display);letter-spacing:-.06em;color:var(--gold);text-shadow:0 1px 0 #F2B630,0 2px 0 #E5A422,0 3px 0 #D59318,0 4px 0 #C2800F,0 5px 0 #AC6C08,0 6px 0 #955A04,0 7px 0 #7E4A02,0 8px 0 #6A3E01,0 26px 40px rgba(0,0,0,.6),0 0 90px rgba(255,159,28,.4);transform:rotateX(70deg) translateY(40px);opacity:0;transition:transform .8s cubic-bezier(.2,1.3,.3,1),opacity .4s}
.intro.on b{transform:none;opacity:1}
.intro span{font:600 17px var(--f-body);padding:9px 18px;border-radius:999px;background:var(--glass-2);border:1px solid var(--stroke)}
.main.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.enter>*{animation:rise .7s cubic-bezier(.2,1.1,.3,1) backwards}
.enter>*:nth-child(2){animation-delay:.08s}.enter>*:nth-child(3){animation-delay:.16s}.enter>*:nth-child(4){animation-delay:.24s}.enter>*:nth-child(5){animation-delay:.32s}.enter>*:nth-child(n+6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(24px) rotateX(-10deg)}}
.slot.intro-in{animation:optIn .6s cubic-bezier(.2,1.3,.3,1) backwards;animation-delay:calc(1.9s + var(--d)*.22s)}
@keyframes optIn{from{opacity:0;transform:translateY(30px) rotateX(-40deg)}}
.qcard.intro-in{animation:qIn .7s cubic-bezier(.2,1.2,.3,1) 1.4s backwards,floaty 7s ease-in-out 2.1s infinite}
@keyframes qIn{from{opacity:0;transform:translateY(20px) rotateX(-25deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Polish pass: calmer, premium ===== */
.card{border:1px solid transparent;background:linear-gradient(160deg,rgba(18,33,74,.72),rgba(10,19,44,.62)) padding-box,linear-gradient(140deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 38%,rgba(255,255,255,.04) 62%,rgba(255,200,61,.35)) border-box;box-shadow:0 30px 70px -30px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
header{padding-block:4px}
.tbtn{border-radius:999px;padding:8px 14px}

/* Title */
.home{gap:18px;padding-top:min(36vh,320px)}
.title3d span{font:600 clamp(15px,1.7vw,19px)/1 var(--f-body);letter-spacing:.5em;color:rgba(227,234,255,.85);margin-bottom:14px;text-shadow:none}
.title3d b{font:800 clamp(84px,12.5vw,168px)/.88 var(--f-display);letter-spacing:-.055em;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%) 180% 0/260% 100% no-repeat,linear-gradient(180deg,#FFF4CC 0%,#FFD25A 38%,#FFB21E 70%,#E07E06 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #9A5A05) drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,159,28,.28));animation:shine 6s ease-in-out infinite,titleFloat 7s ease-in-out infinite}
@keyframes shine{0%,40%{background-position:180% 0,0 0}100%{background-position:-80% 0,0 0}}
@keyframes titleFloat{50%{transform:translateY(-6px)}}
.sub{color:rgba(227,234,255,.78);font-size:clamp(16px,1.4vw,18px)}
.join{padding:20px;gap:12px;border-radius:26px}
.join input{border-radius:16px;background:rgba(2,5,15,.5);border-color:rgba(255,255,255,.16);transition:border-color .2s,box-shadow .2s}
.join input:focus{outline:none;border-color:rgba(255,200,61,.7);box-shadow:0 0 0 4px rgba(255,200,61,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.chips .lbl{font-size:13.5px;color:var(--muted);margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);font:600 13.5px var(--f-body);color:#E3EAFF;backdrop-filter:blur(10px)}
.pill i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 9px/1 var(--f-display);font-style:normal;background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink)}
.pill i svg{width:13px;height:13px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;width:min(860px,100%);margin-top:10px;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
@media (max-width:700px){.steps3{grid-template-columns:1fr}}
.steps3 div{padding:18px 20px;text-align:left;background:rgba(8,15,34,.82);backdrop-filter:blur(14px)}
.steps3 b{display:flex;align-items:center;gap:10px;font:600 16px var(--f-display);letter-spacing:-.01em;margin-bottom:4px}
.steps3 b em{font:700 12px var(--f-mono);font-style:normal;color:var(--gold-txt)}
.steps3 span{font-size:14px;color:var(--muted)}

/* Buttons: slimmer edge */
.btn{border-radius:999px;padding:13px 24px;box-shadow:0 4px 0 var(--edge),0 12px 26px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.gold{box-shadow:0 4px 0 var(--gold-edge),0 14px 30px rgba(255,159,28,.32),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.sm{border-radius:999px}

/* HUD */
.lt{width:54px;height:54px;border-radius:16px;box-shadow:0 4px 0 var(--edge),0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.clock{width:92px;height:92px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(255,200,61,.18)}
.clock::before{inset:5px}
.ava{border-radius:50%}

/* Question + answers */
.qcard{padding:24px 30px 28px;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-4px)}}
.qtext{font-weight:600;font-size:clamp(23px,2.4vw,33px)}
pre.code{background:rgba(2,5,15,.55);border-color:rgba(255,255,255,.09);border-radius:18px}
.opt{border:1px solid transparent;background:linear-gradient(180deg,rgba(24,42,92,.78),rgba(12,23,54,.72)) padding-box,linear-gradient(140deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1)) border-box;box-shadow:0 4px 0 var(--edge),0 14px 30px rgba(0,0,0,.35);padding:17px 18px}
.opt:hover:not(:disabled){box-shadow:0 7px 0 var(--edge),0 22px 40px rgba(0,0,0,.42),0 0 0 1px rgba(255,200,61,.35)}
.opt .l{border-radius:50%;background:transparent;border:1.5px solid rgba(255,200,61,.55)}
.opt.pending{background:linear-gradient(180deg,rgba(90,60,30,.55),rgba(40,22,30,.6)) padding-box,linear-gradient(140deg,var(--gold),rgba(255,200,61,.3)) border-box;box-shadow:0 7px 0 #3A2008,0 0 0 4px rgba(255,200,61,.12),0 22px 40px rgba(0,0,0,.42)}
.opt.locked{background:linear-gradient(180deg,#FFD866,var(--gold) 45%,var(--gold-2)) padding-box,linear-gradient(#fff6,#fff2) border-box;box-shadow:0 3px 0 var(--gold-edge),0 18px 40px rgba(255,159,28,.4)}
.opt.right{background:linear-gradient(180deg,#6EF0A0,var(--ok-2) 40%,var(--ok)) padding-box,linear-gradient(#fff6,#fff2) border-box;box-shadow:0 4px 0 var(--ok-edge),0 18px 44px rgba(34,197,94,.45)}
.opt.wrong{background:linear-gradient(180deg,#FDA4AF,var(--bad-2) 40%,var(--bad)) padding-box,linear-gradient(#fff6,#fff2) border-box;box-shadow:0 4px 0 var(--bad-edge),0 18px 40px rgba(244,63,94,.35)}
.opt.locked .l,.opt.right .l,.opt.wrong .l,.opt.pending .l{border-color:currentColor}
.opt.pending .l{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* Ladder: flat, clean, with a progress rail */
.ladder{transform:none;padding:16px 12px;position:relative}
.ladder li{position:relative;padding:7px 12px 7px 14px;font-size:15.5px}
.ladder li .no{font-size:11.5px}
.ladder li.cur{border-radius:999px}
.ladder li.done{color:rgba(165,175,204,.7)}

/* Result */
.rcard{border-radius:32px}
.rpts{color:transparent;background:linear-gradient(180deg,#FFF4CC,#FFD25A 40%,#FFB21E 72%,#E07E06);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 3px 0 #9A5A05) drop-shadow(0 14px 26px rgba(0,0,0,.5))}
.rpts small{-webkit-text-fill-color:var(--gold-txt)}
.intro b{color:transparent;background:linear-gradient(180deg,#FFF4CC,#FFD25A 40%,#FFB21E 72%,#E07E06);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 4px 0 #9A5A05) drop-shadow(0 24px 40px rgba(0,0,0,.6)) drop-shadow(0 0 60px rgba(255,159,28,.35))}
.lineTile{border:1px solid transparent;background:linear-gradient(180deg,rgba(24,42,92,.78),rgba(12,23,54,.72)) padding-box,linear-gradient(140deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1)) border-box;box-shadow:0 4px 0 var(--edge),0 14px 30px rgba(0,0,0,.35)}
.lineTile .key{border-radius:50%;background:transparent;border:1.5px solid rgba(255,200,61,.55)}
.slotb{border-radius:50%}
.slotb.filled{box-shadow:0 3px 0 var(--gold-edge),0 8px 18px rgba(255,159,28,.3)}
.aids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.aids:empty{display:none}
.poll{height:96px;gap:10px}
.pfill{max-width:44px}
/* Type pass: Unbounded for display, Plus Jakarta Sans for reading */
.title3d b{font:900 clamp(64px,10.5vw,148px)/.95 var(--f-display);letter-spacing:-.04em}
.title3d span{font:600 clamp(13px,1.4vw,16px)/1 var(--f-display);letter-spacing:.45em}
.brand b{font:700 16px/1 var(--f-display);letter-spacing:-.01em}
.qtext{font:700 clamp(23px,2.4vw,32px)/1.25 var(--f-body);letter-spacing:-.02em}
.fffhead h2{font:700 clamp(20px,2.2vw,28px)/1.2 var(--f-display);letter-spacing:-.02em}
.steps3 b,.lifes h3,.panelx h4{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.banner{font:800 clamp(22px,2.6vw,32px)/1 var(--f-display);letter-spacing:-.03em}
.gain{font:800 clamp(20px,2.2vw,28px)/1 var(--f-display)}
.ask{font:700 clamp(18px,2vw,23px) var(--f-display);letter-spacing:-.02em}
.clock span{font:700 30px/1 var(--f-display);letter-spacing:-.04em}
.intro b{font:900 clamp(110px,16vw,190px)/.9 var(--f-display);letter-spacing:-.05em}
.intro span,.chip,.pill,.tbtn,.btn{font-family:var(--f-body)}
.btn{font-weight:800;letter-spacing:-.01em}
.rname{font:700 clamp(20px,2.4vw,26px) var(--f-display);letter-spacing:-.02em}
.rpts{font:900 clamp(52px,8vw,88px)/1 var(--f-display);letter-spacing:-.05em}
.stat b{font:700 18px var(--f-display)}
.opt .l,.lineTile .key,.slotb,.how .n,.ava{font-family:var(--f-display);font-weight:700}
.lt{font:800 13px/1 var(--f-display)}
.me b{font:700 15px/1.15 var(--f-display);letter-spacing:-.01em}
.verdict b{font:700 18px var(--f-display);letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Colour + profile pass ===== */
:root{--bg:#030B22;--muted:#BAC6E8;--mag:#76D2F9;--edge:#0B1940}
.aurora{background:radial-gradient(ellipse 40% 34% at 50% 12%,rgba(70,188,239,.42),transparent 70%),radial-gradient(ellipse 60% 55% at 6% -4%,rgba(40,87,217,.62),transparent 70%),radial-gradient(ellipse 55% 50% at 96% 12%,rgba(70,112,229,.5),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 115%,rgba(38,159,211,.32),transparent 70%),linear-gradient(180deg,#06143A,#030B22 58%,#010718)}
body.inplay #bg3d{opacity:.62}
.card{background:linear-gradient(160deg,rgba(26,53,128,.6),rgba(10,24,62,.66)) padding-box,linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 38%,rgba(118,210,249,.14) 62%,rgba(255,200,61,.42)) border-box}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;background:radial-gradient(circle at 34% 30%,#FFF4C2,#FFC83D 45%,#D98A0B 80%);box-shadow:inset 0 -1.5px 0 #9A5A05,0 0 8px rgba(255,200,61,.55);flex:none}
.coin.md{width:20px;height:20px}.coin.lg{width:34px;height:34px;box-shadow:inset 0 -3px 0 #9A5A05,0 0 18px rgba(255,200,61,.6)}
.tools{align-items:center}
.pchip{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,200,61,.35);backdrop-filter:blur(12px);transition:background .2s,transform .15s}
.pchip:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.pc-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.pc-t b{font:700 13px var(--f-display);letter-spacing:-.01em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-t small{display:flex;align-items:center;gap:5px;font:700 12.5px var(--f-body);color:var(--gold-txt)}
.pc-t .coin{width:12px;height:12px;vertical-align:0}
.ava{border-radius:50%;background:linear-gradient(145deg,#84A4FC,#3A6AED 55%,#2149B6);box-shadow:0 0 0 2px rgba(255,200,61,.7),0 6px 16px rgba(58,106,237,.45)}
.ava.sm{width:32px;height:32px;font-size:14px;display:grid;place-items:center}
.ava.xl{width:84px;height:84px;font-size:34px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,200,61,.8),0 0 40px rgba(70,188,239,.45)}
.tbtn{white-space:nowrap}
@media (max-width:560px){.pc-t b{display:none}.tools{gap:6px}.tools .tbtn{padding:7px 10px;font-size:12px}}
.me{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px}
.me small{font-size:12.5px;color:var(--muted)}
.me b{font:800 20px/1.1 var(--f-display);color:var(--gold-txt);letter-spacing:-.02em}
.walletbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,200,61,.3);font:600 14.5px var(--f-body);color:var(--fg);backdrop-filter:blur(12px)}
.walletbar b{color:var(--gold-txt);font-family:var(--f-display)}
.walletbar .go{color:var(--gold-txt)}
.dotsep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3)}
.ord-ans{color:var(--fg);font:700 16px var(--f-mono);letter-spacing:.2em}

/* Profile */
.profile{max-width:1040px;margin:190px auto 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:860px){.profile{grid-template-columns:1fr}}
.profile>.ractions,.profile>p{grid-column:1/-1;justify-self:center}
.pcard{padding:26px;display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
@media (max-width:860px){.pcard{position:static}}
.ptop{display:flex;align-items:center;gap:18px}
.ptop h2{margin:0 0 8px;font:800 clamp(22px,2.6vw,30px)/1.1 var(--f-display);letter-spacing:-.03em}
.wallet{padding:18px;border-radius:20px;background:rgba(2,5,15,.42);border:1px solid rgba(255,200,61,.25);display:flex;flex-direction:column;gap:10px}
.wl{font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wbal{display:flex;align-items:center;gap:12px}
.wbal b{font:900 clamp(36px,4.6vw,52px)/1 var(--f-display);letter-spacing:-.04em;color:transparent;background:linear-gradient(180deg,#FFF4CC,#FFD25A 40%,#FFB21E 75%,#E07E06);-webkit-background-clip:text;background-clip:text}
.wbal small{font:600 14px var(--f-body);color:var(--muted);align-self:flex-end;margin-bottom:6px}

/* Header emblem: Rupee coin with orbiting rings */
.emb{--s:46px;position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;transform-style:preserve-3d;perspective:240px;flex:none}
.ec{position:relative;width:64%;height:64%;border-radius:50%;display:grid;place-items:center;letter-spacing:-.08em;background:radial-gradient(circle at 34% 30%,#FFF4C2,#FFC83D 45%,#D98A0B 85%);font:800 calc(var(--s)*.25)/1 "JetBrains Mono",monospace;color:#3A2100;box-shadow:inset 0 -2px 0 #9A5A05,0 0 14px rgba(118,210,249,.65),0 0 26px rgba(255,200,61,.35);animation:coinSpin 6s ease-in-out infinite}
.er{position:absolute;inset:0;border-radius:50%;border:2px solid #FFC83D;box-shadow:0 0 8px rgba(255,200,61,.65)}
.er1{animation:ring1 7s linear infinite}
.er2{inset:-5px;border:1.5px solid #B5C8FD;box-shadow:0 0 8px rgba(181,200,253,.7);animation:ring2 9s linear infinite}
@keyframes ring1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes ring2{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(360deg)}}
@keyframes coinSpin{0%,100%{transform:rotateY(-22deg)}50%{transform:rotateY(22deg)}}
.brand:hover .er1{animation-duration:2s}.brand:hover .er2{animation-duration:3s}

/* Home logo (CSS version, used when the 3D studio can't run) */
.homelogo{display:none}

.homelogo .emb{--s:min(220px,52vw);perspective:700px}
.homelogo .er{border-width:5px}.homelogo .er2{inset:-16px;border-width:3px}
.homelogo .er3{inset:-34px;border:2px solid #76D2F9;box-shadow:0 0 12px rgba(118,210,249,.7);animation:ring3 11s linear infinite}
@keyframes ring3{from{transform:rotateX(60deg) rotateY(30deg) rotateZ(0)}to{transform:rotateX(60deg) rotateY(30deg) rotateZ(-360deg)}}
.homelogo{position:relative}.homelogo::before{content:"";position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(118,210,249,.55),rgba(58,106,237,.18) 45%,transparent 70%);z-index:-1}
.homelogo .ec{box-shadow:inset 0 -6px 0 #9A5A05,0 0 22px rgba(255,200,61,.5)}
/* Scrolling Rupee + code symbols (CSS version, used when the 3D studio can't run) */
#symfall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.no3d #symfall{display:block}
#symfall span{position:absolute;bottom:-60px;font:800 var(--fs,24px) "JetBrains Mono",monospace;color:var(--c,#B5C8FD);opacity:var(--o,.35);text-shadow:0 0 14px currentColor;animation:symup var(--d,18s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes symup{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-120vh) rotate(8deg)}}
#kberr{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:14px;background:#3A0A18;border:1px solid #FB7185;color:#FFE4E8;font:600 14px var(--f-body)}

/* ===== Minimal pass: spotlight + deeper 3D controls ===== */
#spot{position:fixed;left:0;top:0;width:var(--sw,520px);height:calc(var(--sw,520px)*.62);pointer-events:none;z-index:-1;border-radius:50%;
 transform:translate(calc(var(--sx,50vw) - 50%),calc(var(--sy,30vh) - 50%));background:radial-gradient(closest-side,rgba(255,236,190,.20),rgba(118,210,249,.10) 55%,transparent 100%);
 transition:transform 1.2s cubic-bezier(.2,.9,.2,1),width 1.2s cubic-bezier(.2,.9,.2,1),height 1.2s cubic-bezier(.2,.9,.2,1),opacity .6s;mix-blend-mode:screen}

@keyframes spotIn{0%{opacity:.2}60%{opacity:1}100%{opacity:1}}
.wrap{position:relative;z-index:1}
/* 3D buttons: thick edge, top highlight, press-down */
.btn{position:relative;border-radius:18px;padding:14px 26px;transform:translateY(0);box-shadow:0 7px 0 var(--edge),0 18px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,filter .2s}
.btn.gold{box-shadow:0 7px 0 var(--gold-edge),0 18px 34px rgba(255,159,28,.4),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(150,80,0,.35)}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--edge),0 6px 12px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.18)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-edge),0 6px 14px rgba(255,159,28,.3),inset 0 2px 0 rgba(255,255,255,.5)}
.tbtn,.pchip{background:linear-gradient(180deg,rgba(40,69,150,.7),rgba(14,29,72,.8));border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 0 var(--edge),0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,box-shadow .12s}
.tbtn:hover,.pchip:hover{transform:translateY(-2px)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Money board (one ladder, checkpoints C1–C5) ===== */
.mboard{width:100%;max-width:1100px;padding:24px;border-radius:28px;text-align:left;display:flex;flex-direction:column;gap:22px}
.mb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mb-head h2{margin:0;font:800 clamp(20px,2.2vw,26px) var(--f-display);letter-spacing:-.03em}
.mb-track{list-style:none;margin:0;padding:0 4%;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.mb-track::before{content:"";position:absolute;left:12%;right:12%;top:27px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold) 0 30%,rgba(255,255,255,.12) 30%)}
.mb-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mb-dot{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:900 16px var(--f-display);letter-spacing:-.03em;color:var(--gold-ink);background:radial-gradient(circle at 34% 30%,#FFF4C2,#FFC83D 45%,#D98A0B 90%);box-shadow:inset 0 -3px 0 #9A5A05,0 0 0 5px rgba(255,200,61,.18),0 0 30px rgba(255,200,61,.45)}
.mb-node.done .mb-dot{box-shadow:inset 0 -3px 0 #9A5A05,0 0 0 5px rgba(74,222,128,.35),0 0 30px rgba(74,222,128,.45)}
.mb-node.soon .mb-dot{background:rgba(16,30,70,.9);border:1px dashed rgba(255,255,255,.25);color:var(--muted);box-shadow:none}
.mb-dot svg{width:18px;height:18px}
.mb-node b{font:800 15px var(--f-display);margin-top:6px}
.mb-amt{font:700 14px var(--f-display);color:var(--gold-txt)}
.mb-q{font-size:12px;color:var(--muted)}
.mb-node.soon b,.mb-node.soon .mb-amt{color:var(--muted)}
.mb-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.mb-stages{grid-template-columns:repeat(2,minmax(0,1fr))}.mb-track{padding:0}.mb-dot{width:44px;height:44px;font-size:13px}.mb-track::before{top:20px}.mb-amt{font-size:11.5px}.mb-q{display:none}}
@media (max-width:520px){.mb-stages{grid-template-columns:1fr}}
.mb-stage{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.mb-stage>b{font:700 15px var(--f-display);letter-spacing:-.02em}
.mb-stage>.muted{font-size:13px}
.mb-stage.soon{opacity:.55}
.mb-c{display:inline-grid;place-items:center;width:34px;height:26px;border-radius:8px;font:800 12px var(--f-display);color:var(--gold-ink);background:linear-gradient(145deg,var(--gold),var(--gold-2))}
.mb-stage.soon .mb-c{background:rgba(255,255,255,.12);color:var(--muted)}
.soonchip{align-self:flex-start;font:600 11.5px var(--f-body);padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
.mb-stage.soon .spath li::before{background:rgba(255,255,255,.3);box-shadow:none}.mb-stage.soon .spath li::after{background:rgba(255,255,255,.18)}
.ladder li{padding:4px 12px;font-size:14.5px}
.ladder li.soonr{opacity:.35}
.ladder li.soonr .no{visibility:hidden}
.ladder li .lk{border-color:rgba(255,200,61,.6)}
.soonkey{display:inline-block;width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.3);margin-right:6px}
.dots i.soon{opacity:.3}
.mb-amt-s{display:none;font:700 12px var(--f-display);color:var(--gold-txt)}
/* C1/C2: no gold, same calm style as the rest of the board */
.mb-track::before{background:rgba(255,255,255,.14)}
.mb-node:not(.soon) .mb-dot{background:linear-gradient(180deg,rgba(48,81,170,.95),rgba(18,38,94,.95));border:1px solid rgba(255,255,255,.3);color:var(--fg);box-shadow:0 5px 0 var(--edge),0 12px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.mb-node:not(.soon) .mb-amt,.mb-node:not(.soon) .mb-amt-s{color:var(--fg)}

@media (max-width:600px){.mb-amt{display:none}.mb-amt-s{display:block}.mb-node b{font-size:13px}}
.srow{display:flex;align-items:flex-start;gap:8px;margin-top:6px}
.srow ul{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- server-backed additions: event card, practice picker, leaderboard tabs, toasts ---- */
.evcard,.prac{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;width:100%;max-width:640px;margin:0 auto 14px;text-align:left}

.prac select{min-height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(6,12,30,.7);color:#fff;padding:0 12px;font:inherit;max-width:220px}
.famepage .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.mine-out{margin-top:10px;border-top:1px dashed rgba(255,255,255,.2);padding-top:10px}
.mb-node.soon{opacity:.5}
#kbtoast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;max-width:min(560px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;background:#0E1B40;border:1px solid #FFC83D;color:#fff;font-weight:600;box-shadow:0 18px 40px -12px #000;transition:opacity .2s,transform .2s}
#kbtoast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Showtime pass: calm while reading, big on the moments that matter =====
   Entrances use one ease-out curve with short staggers. Nothing moves on the question while it is being read;
   motion is kept for answers, lifelines, reveals and the money board. */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--sky:#7DD3FC}
/* Sticky header: its backdrop fades in as the page scrolls (--hb is set from the scroll handler) */
header{position:sticky;top:0;z-index:30;padding-block:10px}
header::before{content:"";position:absolute;inset:0 calc(50% - 50vw);z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(3,9,30,.9),rgba(3,9,30,.66));backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid rgba(255,200,61,.16);opacity:var(--hb,0)}
@media (max-width:760px){header{position:relative}}   /* the header wraps to two rows on phones: let it scroll away */
/* Music toggle: the record turns only while the music bed is playing */
.disc{animation:vinyl 3s linear infinite;animation-play-state:paused}
body.music-live .disc{animation-play-state:running}
@keyframes vinyl{to{transform:rotate(360deg)}}

/* Entrances */
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.enter>*{animation:rise .8s var(--ease-out) backwards}
.home.enter>*{animation:none}
.home .hcenter>*,.home .hside,.home.enter>.mboard{animation:rise .9s var(--ease-out) backwards}
.home .hcenter>*:nth-child(2){animation-delay:.06s}.home .hcenter>*:nth-child(3){animation-delay:.12s}.home .hcenter>*:nth-child(4){animation-delay:.18s}.home .hcenter>*:nth-child(5){animation-delay:.24s}.home .hcenter>*:nth-child(n+6){animation-delay:.3s}
.home .hcenter>.title3d.vault{animation:vaultPop .9s var(--ease-out)}
@keyframes vaultPop{30%{transform:scale(1.08) rotate(-2deg)}}
.home .hleft{animation-delay:.3s}.home .hright{animation-delay:.38s}.home.enter>.mboard{animation-delay:.34s}
#ffflines .lineTile{animation:rise .7s var(--ease-out) backwards}
#ffflines .lineTile:nth-child(2){animation-delay:.06s}#ffflines .lineTile:nth-child(3){animation-delay:.12s}#ffflines .lineTile:nth-child(4){animation-delay:.18s}
/* Home side cards hang slightly crooked, like frames on a wall, and straighten when you look at them */
.hside{transform:rotate(var(--tilt,0deg));transition:transform .4s var(--ease-out)}
.hleft{--tilt:-1.2deg}.hright{--tilt:1.2deg}
.hside:hover{--tilt:0deg}
/* Primary CTA: a soft ring breathes out of it until it is pressed */
.btn.glow::before{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;animation:ctaRing 2.4s var(--ease-out) infinite}
@keyframes ctaRing{0%{box-shadow:0 0 0 0 rgba(255,200,61,.5)}70%,100%{box-shadow:0 0 0 16px rgba(255,200,61,0)}}
/* Loading: the label gives way to a spinner while the server deals the game */
.btn.loading{pointer-events:none;color:transparent!important}
.btn.loading::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid var(--fg);border-right-color:transparent;animation:vinyl .7s linear infinite}
.btn.gold.loading::after{border-color:var(--gold-ink);border-right-color:transparent}

/* Question: still while being read; a fixed stage light from above instead of the old float */
.qcard,.qcard.intro-in{animation:none}
.qcard{position:relative;isolation:isolate}
.qcard::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(60% 80% at 50% -12%,rgba(125,211,252,.16),transparent 70%)}
.qcard.intro-in{animation:qIn .8s var(--ease-out) 1.35s backwards}
@keyframes qIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
.slot.intro-in{animation:optIn .7s var(--ease-out) backwards;animation-delay:calc(1.7s + var(--d)*.08s)}
@keyframes optIn{from{opacity:0;transform:translateY(22px)}}

/* Answers: a light sweep on hover, a breathing gold glow while locked, the others step back */
.opt{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .2s,border-color .2s,opacity .35s,filter .35s}
.opt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%) 150% 0/250% 100% no-repeat;transition:background-position .8s var(--ease-out)}
.opt:hover:not(:disabled)::after{background-position:-150% 0}
.opt.locked.suspense{animation:lockGlow 1.2s ease-in-out infinite}
.opt.locked.suspense::after,.opt.right::after{animation:sheen 1.2s linear infinite}
.opt.right::after{animation-iteration-count:1}
@keyframes lockGlow{50%{box-shadow:0 3px 0 var(--gold-edge),0 0 0 6px rgba(255,200,61,.2),0 18px 54px rgba(255,159,28,.65)}}
@keyframes sheen{from{background-position:150% 0}to{background-position:-150% 0}}
.opts:has(.locked,.right) .opt:not(.locked):not(.right):not(.wrong){opacity:.5;filter:saturate(.5)}
/* 50:50: the two removed answers fade away instead of blinking out */
.slot.gone{visibility:visible;pointer-events:none;animation:vanish .55s var(--ease-out) forwards}
@keyframes vanish{to{opacity:0;transform:scale(.94) translateY(6px);filter:blur(2px);visibility:hidden}}

/* Lifelines: tooltip on hover or keyboard focus, a burst when one is used */
.ll{position:relative}
.ll::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:0;z-index:20;width:max-content;max-width:min(240px,70vw);padding:9px 12px;border-radius:12px;background:#0B1A44;border:1px solid rgba(255,200,61,.4);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);font:600 13px/1.35 var(--f-body);color:var(--fg);text-align:left;white-space:normal;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .25s var(--ease-out);pointer-events:none}
.ll:nth-child(n+3)::after{left:auto;right:0}
.ll:focus-visible::after{opacity:1;transform:none}
@media (hover:hover){.ll:hover::after{opacity:1;transform:none}}
.ll.fire .lt{animation:llFire .8s var(--ease-out) backwards}
.ll.fire .lt::before{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid var(--gold);pointer-events:none;animation:llRing .7s var(--ease-out) forwards}
@keyframes llFire{0%{opacity:1;transform:none}30%{opacity:1;transform:translateY(-6px) scale(1.12)}}
@keyframes llRing{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.7)}}

/* Money board: a gold rail climbs to the current rung; the rung just won flashes green */
.ladder::before,.ladder::after{content:"";position:absolute;left:5px;bottom:16px;width:3px;border-radius:3px;pointer-events:none}
.ladder::before{top:16px;background:rgba(255,255,255,.08)}
.ladder::after{height:calc(var(--lp,0)*(100% - 32px));background:linear-gradient(0deg,var(--gold-2),var(--gold));box-shadow:0 0 10px rgba(255,200,61,.6);animation:rail 1s var(--ease-out) .3s backwards}
@keyframes rail{from{height:calc(var(--lp0,0)*(100% - 32px))}}
.ladder li.cur.won{background:linear-gradient(180deg,#6EF0A0,var(--ok-2) 45%,var(--ok));color:var(--ok-ink);box-shadow:0 4px 0 var(--ok-edge),0 12px 26px rgba(34,197,94,.45);animation:rungWin .7s var(--ease-out)}
.ladder li.cur.won .no,.ladder li.cur.won .lk{color:var(--ok-ink)}
@keyframes rungWin{40%{transform:scale(1.06)}}
/* Correct answer: a warm flash from the centre (the wrong-answer flash is red from the edges) */
.redflash.gold{background:radial-gradient(ellipse at center,rgba(255,200,61,.24),transparent 60%)}

/* Question intro: a band of light opens behind the number */
.intro::before{content:"";position:absolute;left:50%;top:50%;width:min(960px,130vw);height:280px;transform:translate(-50%,-50%) scaleX(.15);background:radial-gradient(closest-side,rgba(255,200,61,.26),rgba(125,211,252,.08) 60%,transparent);opacity:0;transition:transform .9s var(--ease-out),opacity .5s}
.intro.on::before{transform:translate(-50%,-50%) scaleX(1);opacity:1}
.intro b{transition:transform .9s var(--ease-out),opacity .4s}

/* Result */
.rcard{animation:cardIn 1s var(--ease-out)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) rotateY(-14deg)}}
.rcard .stat{animation:rise .7s var(--ease-out) backwards}
.rcard .stat:nth-child(1){animation-delay:.5s}.rcard .stat:nth-child(2){animation-delay:.58s}.rcard .stat:nth-child(3){animation-delay:.66s}
.rpts.glow{animation:amtGlow 2.6s ease-in-out 1.5s infinite}
@keyframes amtGlow{50%{filter:drop-shadow(0 3px 0 #9A5A05) drop-shadow(0 14px 26px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(255,200,61,.5))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.slot.gone{visibility:hidden}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){"use strict";
/* Safe to run twice: a second copy (e.g. after a live update) removes the first copy's listeners. */
try{window.__kbcAC&&window.__kbcAC.abort()}catch(e){}
const KBAC=new AbortController();window.__kbcAC=KBAC;const KBSIG={signal:KBAC.signal};
/* Show any script error on screen so it can be reported */
function kbErr(m){try{let t=document.getElementById("kberr");if(!t){t=document.createElement("div");t.id="kberr";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent="Something went wrong: "+m+" — reload the page to continue.";t.hidden=false}catch(e){}}
window.addEventListener("error",e=>kbErr(e.message||"script error"),KBSIG);
window.addEventListener("unhandledrejection",e=>{const r=e.reason;if(r&&r.code)return;kbErr((r&&r.message)||String(r))},KBSIG);
/* ================= Server link =================
   The server deals every question, keeps the clock and checks each answer (server/game.js). This page only shows
   what it is sent: the question and its 4 options in a shuffled order. The right option and the explanation arrive
   after an answer is locked in. */
let BOOT=null,OFF=0;   // OFF: server clock minus this device's clock
async function api(method,url,body){
 let r;try{r=await fetch(url,{method,credentials:"same-origin",headers:body!==undefined?{"content-type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined})}
 catch(e){throw Object.assign(new Error("No connection. Check your internet and try again."),{code:"OFFLINE"})}
 const d=await r.json().catch(()=>({}));
 if(r.status===401){location.href="/login";throw Object.assign(new Error("Please log in."),{code:"AUTH"})}
 if(!r.ok)throw Object.assign(new Error(d.message||"Something went wrong."),{code:d.error||"ERR",data:d});
 const sn=d.serverNow||(d.game&&d.game.serverNow);if(sn)OFF=sn-Date.now();
 return d}
const local=ms=>ms-OFF;   // a server timestamp on this device's clock
let toastT=null;
function say(msg){let t=$("#kbtoast");if(!t){t=document.createElement("div");t.id="kbtoast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),4200)}
const oops=e=>{if(e&&e.code!=="AUTH")say(e.message||String(e))};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const unbusy=()=>document.querySelectorAll(".btn.loading").forEach(b=>{b.classList.remove("loading");b.removeAttribute("aria-busy")});

/* ================= Ladder (from the server: Admin → Ladder & pools) ================= */
let LADDER=[],CHECK={},CHK_IDX=[],OPEN=6,TIME=[],STAGES=[],SKILLS={};
function setLadder(L){LADDER=L.rungs.map(r=>r.amount);TIME=L.rungs.map(r=>r.timeSec);CHECK={};CHK_IDX=[];
 L.rungs.forEach((r,i)=>{if(r.checkpoint){CHECK[i]=r.checkpoint;CHK_IDX.push(i)}});OPEN=L.openRungs;

let nbuf=null;function noiseBuf(a){if(nbuf)return nbuf;nbuf=a.createBuffer(1,a.sampleRate*1.5,a.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nbuf}
function sweep(f0,f1,d,delay=0,vol=.08,type="bandpass"){if(!soundOn)return;try{const a=ctx(),t=a.currentTime+delay,n=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();n.buffer=noiseBuf(a);fl.type=type;fl.Q.value=6;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t+d+.08);n.connect(fl);fl.connect(g);g.connect(a.destination);n.start(t);n.stop(t+d+.1)}catch(e){}}
function boom(f=60,d=.5,delay=0,vol=.35){if(!soundOn)return;try{const a=ctx(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(f*2.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.09);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function slide(f0,f1,d,delay=0,vol=.07,type="sawtooth"){if(!soundOn)return;try{const a=ctx(),t=a.currentTime+delay,o=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);fl.type="lowpass";fl.frequency.value=1600;g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(fl);fl.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

function focusSpot(sweep){const sp=$("#spot");if(!sp)return;const el=spotTarget();let x=innerWidth/2,y=innerHeight*.35,w=520;
 if(el){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=Math.min(innerHeight*.6,Math.max(80,r.top+r.height/2));w=Math.min(innerWidth*.95,r.width*1.25)}
 if(sweep&&!reduce){sp.classList.remove("land");sp.style.setProperty("--sx",x+"px");sp.style.setProperty("--sy","-220px");sp.style.setProperty("--sw",w*1.8+"px");void sp.offsetWidth;sp.classList.add("land")}
 requestAnimationFrame(()=>{sp.style.setProperty("--sx",x+"px");sp.style.setProperty("--sy",y+"px");sp.style.setProperty("--sw",w+"px")});
 window.KB3D&&KB3D.aim&&KB3D.aim(x,y,sweep)}

 const R=g.result;countTo($("#rpts"),R.amount,1400,v=>fmtR(v));if(R.coins)countTo($("#ecoins"),R.coins,1600,v=>"+"+v.toLocaleString("en-IN"));

function countTo(el,to,dur,f){if(!el)return;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/dur);el.innerHTML=f(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function flashRight(){const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("gold","on");const r=$(".ladder li.cur");r&&r.classList.add("won")}
function flashWrong(){const f=$("#flash");f.classList.remove("on","gold");void f.offsetWidth;f.classList.add("on");const m=$(".main");if(m){m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake")}window.KB3D&&KB3D.alarm()}
function confetti(n=140){if(reduce)return;const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#FFC83D","#FF9F1C","#FFFFFF","#76D2F9","#4ADE80"];
 const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight*.45,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*7+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 const t0=performance.now();const f=t=>{const e=t-t0;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-e/2800);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(e<2800)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)};requestAnimationFrame(f)}

/* ================= Game moves (all checked by the server) ================= */
async function begin(body){if(S.busy)return;S.busy=true;ctx();
 try{const d=await api("POST","/api/game/start",body);setLadder(d.ladder);S={screen:"play",hint:null};fromGame(d.game);intro();render();scrollTo({top:0})}
 catch(e){oops(e)}finally{S.busy=false;unbusy()}}
function seat(fffRunId){return begin({mode:"classic",fffRunId:fffRunId||""})}
function revealFrom(r,timeout){const g=r.game,rv=r.reveal||{ok:false,correct:-1,why:"",timeUp:true};
 S.reveal=rv;S.revealed=true;S.timeout=!!(timeout||rv.timeUp);S.locked=true;S.next=g;stopQ();musicStop();
 (rv.ok?SFX.right:SFX.wrong)();syncPlay();
 if(rv.ok){SFX.coins(8+S.level*2);confetti();flashRight();countTo($("#gain"),LADDER[S.level],900,v=>"+"+fmtR(v));window.KB3D&&KB3D.boost();if(CHECK[S.level])setTimeout(()=>{SFX.fanfare();confetti(220)},700)}else flashWrong()}
async function lockIn(){if(S.locked||S.pick==null)return;S.locked=true;stopQ();SFX.lock();syncPlay();
 try{const [r]=await Promise.all([api("POST",`/api/game/${S.g.id}/answer`,{rung:S.level,pick:S.pick}),wait(reduce?400:2000)]);
  if(S.screen!=="play")return;
  if(!r.reveal){S.locked=false;fromGame(r.game);if(r.game.state==="done")return showResult(r.game);render();return}
  revealFrom(r,false)}
 catch(e){S.locked=false;oops(e);if(e.code==="STALE"||e.code==="OVER")resume(S.g.id);else{syncPlay();startQ()}}}
async function nextQ(){if(S.busy)return;S.busy=true;try{const d=await api("POST",`/api/game/${S.g.id}/next`);S.hint=null;fromGame(d.game);intro();render()}catch(e){oops(e)}finally{S.busy=false;unbusy()}}
async function lifeline(k){if(S.used[k]!=null||S.busy)return;S.busy=true;S.quitAsk=false;
 if(k==="poll"){S.poll={loading:true};SFX.whoosh()}syncPlay();
 try{const d=await api("POST",`/api/game/${S.g.id}/lifeline`,{k});S.used=d.game.used;S.g=d.game;
  S.fx=k;   // one-shot burst on the lifeline just used (cleared after this paint)
  if(k==="fifty"){S.gone=d.data.removed;if(S.gone.includes(S.pick))S.pick=null;SFX.whoosh()}
  else if(k==="poll")S.poll=d.data;
  else if(k==="expert"){S.hint=d.data.hint;SFX.pick()}
  else if(k==="flip"){S.busy=false;S.hint=null;fromGame(d.game);SFX.whoosh();intro();render();S.fx=null;return}
  S.busy=false;syncPlay();S.fx=null}
 catch(e){S.busy=false;if(k==="poll")S.poll=null;oops(e);syncPlay()}}
async function quitGame(){try{const d=await api("POST",`/api/game/${S.g.id}/quit`);showResult(d.game)}catch(e){oops(e)}}
// Back after a reload or a lost connection: pick the game up where the server has it.
async function resume(id){try{const d=await api("GET","/api/game/"+id);setLadder(d.ladder);
 if(d.game.state==="done")return showResult(d.game);
 S={screen:"play",hint:null};fromGame(d.game);
 if(!d.game.question)return nextQ();   // between questions: show the next one
 intro();render()}catch(e){unbusy();oops(e)}}
