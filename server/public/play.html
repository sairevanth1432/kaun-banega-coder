<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Kaun Banega Coder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Great+Vibes&display=swap">
<style>
/* Layout: quiz-show app over a live 3D studio (gold { } coin + rings, spotlights, drifting code glyphs). Home = hero + join + progress beside a vertical 15-rung money board. Hot seat = HUD, question card, answers, feedback, board on the right. Team view = dashboard. KBC palette: deep violet + gold, single dark theme (the original Kaun Banega Coder look). */
:root{
  --bg:#0A0322; --surface:rgba(40,22,96,.62); --surface-2:rgba(255,255,255,.06); --raised:#3A2486;
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.24);
  --fg:#F6F2FF; --muted:#C3BAE8;
  --gold:#FFC83D; --gold-2:#FF9F1C; --gold-ink:#241500; --gold-txt:#FFD66B; --gold-edge:#B5650A;
  --ok:#4ADE80; --ok-ink:#03200D; --ok-txt:#86EFAC;
  --bad:#FB7185; --bad-ink:#2A030B; --bad-txt:#FDA4AF;
  --mag:#E879F9; --edge:#1A0B40; --code-bg:rgba(5,2,15,.6); --code-fg:#EDE9FF;
  --glow1:rgba(109,40,217,.62); --glow2:rgba(217,70,239,.42); --glow3:rgba(79,70,229,.5);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 40% 34% at 50% 12%,var(--glow2),transparent 70%),radial-gradient(ellipse 60% 55% at 6% -4%,var(--glow1),transparent 70%),radial-gradient(ellipse 55% 50% at 96% 12%,var(--glow3),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 115%,rgba(192,38,211,.32),transparent 70%),linear-gradient(180deg,#14063A,#0A0322 58%,#070118)}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .8s}
body.inplay #bg3d{opacity:.38}
body.inplay #symfall,body.inteam #symfall{display:none}
body.inteam #bg3d{opacity:.22}
#symfall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.no3d #symfall{display:block}
#symfall span{position:absolute;bottom:-60px;font:800 var(--fs,24px) var(--f-mono);color:var(--c,#C4B5FD);opacity:var(--o,.35);text-shadow:0 0 14px currentColor;animation:symup var(--d,18s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes symup{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-120vh) rotate(8deg)}}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:var(--gold-txt)}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin-top:4px;padding:8px 12px;border-radius:20px;background:rgba(40,20,96,.28);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.coach{display:flex;align-items:center;gap:12px}
.coach .say{max-width:none;flex:1;min-width:0}
.stake .nthumb{width:64px;margin:4px 0 2px;transform:rotate(-4deg)}
.mrow{grid-template-columns:minmax(0,1fr)!important}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line-2);color:var(--fg);font:700 15px var(--f-mono);white-space:pre;transition:background .15s,border-color .15s}
.mchip:hover:not(:disabled){border-color:var(--gold)}
.mchip.on{background:linear-gradient(180deg,#FFE08A,var(--gold) 45%,var(--gold-2));color:var(--gold-ink);border-color:transparent}
.mchip.ok{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.mchip.no{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font:800 15px/1 var(--f-display);letter-spacing:-.01em}
.brand b span{color:var(--gold-txt)}
.emb{--s:46px;position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;transform-style:preserve-3d;perspective:240px;flex:none}
.ec{position:relative;width:64%;height:64%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 30%,#FFF4C2,#FFC83D 45%,#D98A0B 85%);font:800 calc(var(--s)*.2)/1 var(--f-mono);letter-spacing:-.06em;color:#3A2100;box-shadow:inset 0 -2px 0 #9A5A05,0 0 14px rgba(232,121,249,.65),0 0 26px rgba(255,200,61,.35);animation:coinSpin 6s ease-in-out infinite}
.er{position:absolute;inset:0;border-radius:50%;border:2px solid #FFC83D;box-shadow:0 0 8px rgba(255,200,61,.65);animation:ring1 7s linear infinite}
.er2{inset:-5px;border:1.5px solid #C4B5FD;box-shadow:0 0 8px rgba(196,181,253,.7);animation:ring2 9s linear infinite}
@keyframes ring1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes ring2{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(360deg)}}
@keyframes coinSpin{0%,100%{transform:rotateY(-22deg)}50%{transform:rotateY(22deg)}}
.brand:hover .er{animation-duration:2s}
.coinlogo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 34% 30%,#FFF4C2,var(--gold) 45%,#D98A0B 85%);box-shadow:inset 0 -3px 0 #9A5A05,0 0 0 2px rgba(255,200,61,.35),0 0 18px rgba(255,200,61,.35);font:800 12px/1 var(--f-mono);color:#3A2100;letter-spacing:-.06em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:linear-gradient(180deg,rgba(70,40,150,.7),rgba(30,14,72,.8));border:1px solid rgba(255,255,255,.16);font:600 13.5px var(--f-body);color:var(--muted);box-shadow:0 4px 0 var(--edge),0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(12px);transition:transform .12s,box-shadow .12s}
.tbtn:hover{color:var(--fg);transform:translateY(-2px)}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn[aria-pressed="false"]{opacity:.55}
.wchip{color:var(--fg);border-color:rgba(255,200,61,.45)}
.wchip b{font:800 13px var(--f-display);color:var(--gold-txt)}
@media (max-width:600px){.tbtn .lbl{display:none}.brand b{font-size:13px}}

/* Cards and buttons */
.card{border:1px solid transparent;border-radius:24px;background:linear-gradient(160deg,rgba(56,26,128,.6),rgba(24,10,62,.66)) padding-box,linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 38%,rgba(232,121,249,.14) 62%,rgba(255,200,61,.42)) border-box;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 0 rgba(12,5,34,.85),0 34px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:18px;font:800 15.5px var(--f-body);letter-spacing:-.01em;background:linear-gradient(180deg,#3A2486,#24125E);border:1px solid rgba(255,255,255,.14);box-shadow:0 7px 0 var(--edge),0 18px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,filter .2s;text-decoration:none;color:var(--fg)}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--edge),0 6px 12px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#FFD866,var(--gold) 40%,var(--gold-2));color:var(--gold-ink);border-color:rgba(255,255,255,.35);box-shadow:0 7px 0 var(--gold-edge),0 18px 34px rgba(255,159,28,.4),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(150,80,0,.35)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-edge),0 6px 14px rgba(255,159,28,.3)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--muted);font-weight:700}
.btn.quiet:hover{color:var(--fg)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:700 12.5px/1.2 var(--f-body);color:var(--muted)}
.chip.gold{background:linear-gradient(120deg,var(--gold),var(--gold-2));color:var(--gold-ink);border-color:transparent}
.chip.ok{color:var(--ok-txt);border-color:currentColor;background:transparent}

/* Mascot */
/* Reserve Bank of Coding notes: 3D paper bills */
.bill3d{display:block;width:min(340px,100%);margin:0 auto;padding:0;border:0;background:none;perspective:1000px;cursor:pointer}
.bill3d:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:8px}
.b3-in{position:relative;display:block;transform-style:preserve-3d;transform:rotateX(14deg) rotateY(-16deg) rotateZ(-2deg);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.bill3d:hover .b3-in{transform:rotateX(6deg) rotateY(-4deg)}
.bill3d.flip .b3-in{transform:rotateX(14deg) rotateY(164deg) rotateZ(2deg)}
.bill3d.won .b3-in{animation:billIn 1.1s cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes billIn{from{transform:rotateX(60deg) rotateY(-200deg) translateY(-40px) scale(.6);opacity:0}}
.b3-face{position:relative;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 18px 30px -10px rgba(0,0,0,.65),0 40px 60px -30px rgba(0,0,0,.6)}
.b3-face svg{display:block;width:100%;height:auto}
.b3-back{position:absolute;inset:0;transform:rotateY(180deg)}
.b3-face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.1) 54%,transparent 62%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:soft-light;animation:gloss 5s ease-in-out infinite}
@keyframes gloss{0%,55%{background-position:130% 0}100%{background-position:-60% 0}}
.nthumb{display:inline-block;width:34px;flex:none;vertical-align:middle;border-radius:2px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.45);transform:rotate(-4deg)}
.nthumb svg{display:block;width:100%;height:auto}
.nthumb.big{width:110px;margin:4px 0 6px;transform:rotate(-5deg);box-shadow:0 10px 18px rgba(0,0,0,.5);animation:noteFloat 3.6s ease-in-out infinite}
@keyframes noteFloat{50%{transform:rotate(-2deg) translateY(-3px)}}
.amtc{display:inline-flex;align-items:center;gap:8px;min-width:0}
.rungup .bill3d{width:min(300px,100%);margin-bottom:6px}
.rnote{margin:10px 0 4px}
.mascot.pup{filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.mascot.pup.idle{animation:bob 3.2s ease-in-out infinite}
.mascot.pup .ptail{transform-box:fill-box;transform-origin:0% 100%}
.mascot.pup.happy .ptail{animation:wag .35s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.mascot.bot{filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.mascot.bot .beyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mascot.bot.idle .blook{animation:glance 7s ease-in-out infinite}
@keyframes glance{0%,30%,100%{transform:translateX(0)}40%,55%{transform:translateX(-6px)}65%,80%{transform:translateX(5px)}}
.mascot.bot.think .blook{animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-8px)}to{transform:translateX(4px)}}
.docknote{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.docknote small{font:700 11.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.docknote .bill3d{width:100%}
/* Result: full-width layout with the money board on the right */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30%);gap:26px;margin-top:18px;align-items:start}
.res-main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;min-width:0}
.res-hero{padding:24px;border-radius:28px;display:flex;flex-direction:column;gap:16px;text-align:center}
.res-hero .coach{text-align:left}
.res-amt{display:flex;flex-direction:column;align-items:center;gap:2px}
.res-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.res-info .res-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.res-stats .stat{padding:16px}
.res-stats .stat b{font-size:24px}
.goal{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.goal h3{margin:0;font:800 17px var(--f-display);color:var(--gold-txt)}
.goal p{margin:0;font-size:14px}
.res-note{margin:0;font-size:13px}
@media (max-width:1180px){.res-main{grid-template-columns:1fr}}
@media (max-width:1000px){.res{grid-template-columns:1fr}.res>.side{display:none}}
.mascot.host{filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.mascot.host .hblink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot.rbot{filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.mascot.rbot .rblink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
.mascot{display:inline-block;flex:none;animation:bob 3.2s ease-in-out infinite}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.mascot.happy{animation:hop .6s cubic-bezier(.2,1.6,.4,1) 2,bob 3.2s 1.2s ease-in-out infinite}
.mascot.sad{animation:droop 1.2s ease-out forwards}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes hop{40%{transform:translateY(-16px) rotate(6deg) scale(1.05)}}
@keyframes droop{to{transform:translateY(4px) rotate(-6deg)}}
.say{position:relative;background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;padding:10px 14px;font:600 14.5px/1.4 var(--f-body);max-width:34ch}
.say::before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--surface-2);border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);transform:rotate(45deg)}
.buddy{display:flex;align-items:flex-start;gap:12px}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);gap:24px;margin-top:18px;padding-top:min(30vh,260px);align-items:start}
body.no3d .home{padding-top:0}
@media (max-width:920px){.home{grid-template-columns:1fr}}
.hero{display:flex;flex-direction:column;gap:18px;min-width:0}
.ttl{margin:0;display:flex;flex-direction:column;gap:6px}
.ttl span{font:700 clamp(13px,1.4vw,16px)/1 var(--f-display);letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
.ttl b{font:900 clamp(56px,9vw,112px)/.92 var(--f-display);letter-spacing:-.05em;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%) 180% 0/260% 100% no-repeat,linear-gradient(180deg,#FFF4CC 0%,#FFD25A 38%,#FFB21E 70%,#E07E06 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #9A5A05) drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,159,28,.28));animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,40%{background-position:180% 0,0 0}100%{background-position:-80% 0,0 0}}
.lede{margin:0;font-size:clamp(16px,1.5vw,18.5px);color:var(--muted);max-width:56ch}
.join{padding:18px;display:flex;flex-direction:column;gap:10px}
.join label{font:700 13px var(--f-body);color:var(--gold-txt)}
.join .row{display:flex;gap:10px;flex-wrap:wrap}
.join input{flex:1 1 220px;min-width:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;color:var(--fg);padding:13px 16px;font:600 16.5px var(--f-body)}
.join input.need{border-color:var(--bad);box-shadow:0 0 0 4px rgba(255,90,120,.18)}
.join small{color:var(--muted);font-size:13.5px}
.prog{padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.prog .big{font:900 clamp(30px,4vw,44px)/1 var(--f-display);letter-spacing:-.04em;color:var(--gold-txt);font-variant-numeric:tabular-nums}
.prog .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mag),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.step{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.step em{font:700 12px var(--f-mono);font-style:normal;color:var(--gold-txt)}
.step b{font:700 15px/1.25 var(--f-display);letter-spacing:-.01em}
.step span{font-size:14px;color:var(--muted)}
.lifes{display:flex;flex-wrap:wrap;gap:10px}
.lifes div{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.lifes i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 10.5px var(--f-display);font-style:normal;background:var(--raised);border:1px solid var(--line-2)}
.lifes i svg{width:16px;height:16px}

/* Money board */
.board{padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.board h2{margin:2px 8px 8px;font:700 15px var(--f-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.board h2 small{font:600 12px var(--f-body);color:var(--muted)}
.rung{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;font:700 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rung .no{font-size:11.5px;color:var(--muted);text-align:right}
.rung .tg{font:700 10.5px/1 var(--f-body);padding:3px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);letter-spacing:0;white-space:nowrap}
.rung.ck .tg{border-color:rgba(255,200,61,.6);color:var(--gold-txt)}
.rung.done{color:var(--muted)}
.rung.done .no{color:var(--ok-txt)}
.rung.next{background:linear-gradient(180deg,#FFE08A,var(--gold) 45%,var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-edge),0 10px 24px rgba(255,159,28,.35)}
.rung.next .no,.rung.next .tg{color:var(--gold-ink);border-color:rgba(42,24,0,.35)}
.rung.soon{opacity:.38}
.split{font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px}

/* Home: minimal centered column under the 3D coin */
.h2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;max-width:640px;margin:0 auto;padding-top:min(34vh,290px)}
body.no3d .h2{padding-top:48px}
.h2 .ttl{align-items:center}
.h2 .ttl span{letter-spacing:.55em;padding-left:.55em}
.h2 .ttl b{font-size:clamp(76px,15vw,156px)}

.enter>*{animation:rise .55s cubic-bezier(.2,1.1,.3,1) backwards}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Colour pass: midnight indigo base, slate surfaces, gold = money, teal = progress, coral = mistakes ===== */
:root{--bg:#090C22;--surface:rgba(24,28,64,.72);--surface-2:rgba(255,255,255,.05);--raised:#232857;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--muted:#A7AED3;--edge:#0B0E26;--mag:#2DD4BF;--teal:#2DD4BF;--coral:#FB7185;--glow1:rgba(67,56,202,.42);--glow2:rgba(45,212,191,.14);--glow3:rgba(99,102,241,.26)}
.aurora{background:radial-gradient(ellipse 60% 45% at 8% -10%,var(--glow1),transparent 70%),radial-gradient(ellipse 50% 40% at 96% 0%,var(--glow3),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 120%,var(--glow2),transparent 70%),linear-gradient(180deg,#0E1233,#090C22 60%)}
.card{background:linear-gradient(180deg,rgba(30,35,78,.84),rgba(20,24,58,.84));border:1px solid var(--line);box-shadow:0 24px 48px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05)}
header{background:rgba(18,22,54,.6);border-color:var(--line)}
.btn{background:linear-gradient(180deg,#2A3068,#1C2150);border-color:rgba(255,255,255,.1)}
.btn.quiet{background:transparent;border-color:var(--line-2);box-shadow:none}
.tbtn{background:rgba(30,35,78,.75);border-color:var(--line-2)}
.ll .lt{background:linear-gradient(180deg,#2A3068,#1C2150);border-color:var(--line-2)}
.opt{background:linear-gradient(180deg,rgba(34,40,88,.92),rgba(24,28,66,.92)) padding-box,linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.04)) border-box}
.say,.say::before{background:rgba(30,35,78,.9);border-color:var(--line-2)}
.clock::before{background:radial-gradient(circle at 50% 28%,#2A2F6A,#0E1130 75%)}
.bar{background:rgba(255,255,255,.08);border-color:transparent}
.bar i{background:linear-gradient(90deg,var(--teal),#7CF0AE)}
.panel.bad{border-color:var(--line)}.panel.bad h3{color:var(--coral)}
.pips i.on{background:var(--teal);border-color:var(--teal);box-shadow:0 0 8px rgba(45,212,191,.6)}
.hchip:hover,.hchip.on{border-color:rgba(45,212,191,.6);background:rgba(45,212,191,.08)}
/* Result: one clean card + money board */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30%);gap:26px;margin-top:18px;align-items:start}
.res-card{padding:28px;border-radius:28px;display:flex;flex-direction:column;gap:24px;min-width:0}
.res-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.res-head{display:flex;flex-direction:column;gap:6px;min-width:0}
.res-head .coach{margin-bottom:10px}
.res-head .ramt{text-align:left}
.res-bill{padding:6px 10px 18px}
.res-bill .bill3d{width:min(380px,100%)}
.res-line{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.res-line div{padding:14px 16px;display:flex;flex-direction:column-reverse;gap:2px}
.res-line div+div{border-left:1px solid var(--line)}
.res-line dt{font:600 12.5px var(--f-body);color:var(--muted)}
.res-line dd{margin:0;font:800 22px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res-goal{display:flex;flex-direction:column;gap:8px}
.res-goal-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.res-goal-h b{font:800 17px var(--f-display);color:var(--fg)}
.res-goal .muted{font-size:13.5px}
.res-learn{padding:16px 18px;border-radius:14px;background:rgba(251,113,133,.06);border-left:3px solid var(--coral);display:flex;flex-direction:column;gap:8px}
.res-learn h3{margin:0;display:flex;align-items:center;gap:8px;font:700 15px var(--f-display);color:var(--coral)}
.res-learn h3 svg{width:17px;height:17px}
.res-learn p{margin:0;max-width:72ch}
.res-learn a{color:var(--teal);font-weight:700}
.res-card .ractions{justify-content:flex-start}
@media (max-width:1180px){.res-top{grid-template-columns:1fr}.res-line{grid-template-columns:repeat(2,minmax(0,1fr))}.res-line div:nth-child(3){border-left:0}.res-line div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:1000px){.res{grid-template-columns:1fr}.res>.side{display:none}}

/* ===== Spotlight on the question ===== */
#beam{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,rgba(255,240,205,.38),rgba(255,236,190,.12) 60%,rgba(255,236,190,.04));filter:blur(6px);clip-path:polygon(var(--bx1,48%) 0,var(--bx2,52%) 0,var(--br,70%) var(--bb,40%),var(--bl,30%) var(--bb,40%))}
#spot{position:fixed;left:0;top:0;width:var(--sw,600px);height:var(--sh,300px);transform:translate(var(--sx,0),var(--sy,0));pointer-events:none;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,190,.42),rgba(255,200,61,.14) 55%,transparent);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.2,1),width 1s,height 1s,opacity .5s,background .4s}
body.qscreen #beam,body.qscreen #spot{opacity:1}
#spot.win{background:radial-gradient(closest-side,rgba(255,214,107,.5),rgba(255,200,61,.18) 55%,transparent)}
#spot.lose{background:radial-gradient(closest-side,rgba(251,113,133,.34),rgba(251,113,133,.1) 55%,transparent)}
#beam.sweep{animation:beamIn 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes beamIn{from{opacity:0;transform:translateX(-35%) skewX(12deg)}}
/* ===== Fit the question screen into one screen at 100% zoom ===== */
.wrap{padding-block:8px 16px}
header{padding:6px 12px;margin-top:2px}
.left{gap:12px}
.hud{margin-top:4px}
.clock{width:72px;height:72px}.clock span{font-size:24px}
.ll .lt{width:44px;height:44px;border-radius:14px}.ll .lt svg{width:19px;height:19px}.ll .cap{font-size:11px}
.stake b{font-size:18px}.stake .nthumb{width:54px}
.qcard{padding:16px 22px 18px;gap:10px}
.qtext{font-size:clamp(18px,1.4vw + .9vh,26px)}
pre.code{padding:10px 14px;font-size:clamp(13.5px,.8vw + .55vh,16px);line-height:1.5}
.opts{gap:10px}.opt{padding:11px 14px;box-shadow:0 4px 0 var(--edge)}.opt .l{width:30px;height:30px}.opt .t{font-size:15.5px}
.dockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dockrow .coach{flex:1 1 320px;min-width:0}
.dockrow .actions{flex:0 1 auto;min-height:0;justify-content:flex-end}
.side{top:calc(env(safe-area-inset-top,0px) + 70px);height:calc(100vh - 86px);min-height:470px}
.side .board{padding:14px 14px 12px}.side .board h2{margin:0 8px 6px}
.side .rung{min-height:24px}
footer{margin-top:14px}

/* ===== Stage lights: three cones from the top converge on the question card ===== */
.beam{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .5s;transform-origin:50% 0;filter:blur(7px)}
.beam.c{background:linear-gradient(180deg,rgba(255,242,210,.36),rgba(255,236,190,.12) 65%,rgba(255,236,190,.03));clip-path:polygon(var(--c1,48%) 0,var(--c2,52%) 0,var(--c3,70%) var(--cb,40%),var(--c4,30%) var(--cb,40%))}
.beam.l,.beam.r{background:linear-gradient(180deg,rgba(255,236,190,.22),rgba(255,214,140,.07) 70%,transparent)}
.beam.l{clip-path:polygon(var(--l1,0) 0,var(--l2,6%) 0,var(--l3,50%) var(--lb,40%),var(--l4,44%) var(--lb,40%))}
.beam.r{clip-path:polygon(var(--r1,94%) 0,var(--r2,100%) 0,var(--r3,56%) var(--rb,40%),var(--r4,50%) var(--rb,40%))}
body.qscreen .beam{opacity:1}
.beam.on{animation:beamOn .9s cubic-bezier(.2,.9,.2,1)}
.beam.l.on{animation-delay:.12s}.beam.r.on{animation-delay:.24s}
@keyframes beamOn{0%{opacity:0;transform:scaleY(.08)}55%{opacity:1}100%{opacity:1;transform:scaleY(1)}}
/* ===== KBC lozenge answer bars ===== */
.opt{position:relative;isolation:isolate;border:0!important;box-shadow:none!important;padding:13px 32px!important;background:linear-gradient(90deg,rgba(255,200,61,.75),rgba(255,255,255,.22) 50%,rgba(255,200,61,.75))!important;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%);transform:none!important}
.opt::after{content:"";position:absolute;inset:1.6px;z-index:-1;clip-path:polygon(19px 0,calc(100% - 19px) 0,100% 50%,calc(100% - 19px) 100%,19px 100%,0 50%);background:linear-gradient(180deg,#252C6C,#151A45);transition:background .2s}
.opt:hover:not(:disabled)::after{background:linear-gradient(180deg,#303A8C,#1B2156)}
.opt.pending::after{background:linear-gradient(180deg,#6B5014,#3C2B08)}
.opt.locked::after{background:linear-gradient(180deg,#FFE08A,#FFB21E)}
.opt.right::after{background:linear-gradient(180deg,#5EEA9B,#16A34A)}
.opt.wrong::after{background:linear-gradient(180deg,#FB8A9C,#BE123C)}
.opt.locked,.opt.right,.opt.wrong{background:linear-gradient(90deg,#fff,rgba(255,255,255,.6) 50%,#fff)!important}
.opt .l{border-color:var(--gold)}
.opts{position:relative}
.opts::before{content:"";position:absolute;left:-24px;right:-24px;top:50%;height:1.5px;background:linear-gradient(90deg,transparent,rgba(255,200,61,.45) 12%,rgba(255,200,61,.45) 88%,transparent);z-index:-1}
.qcard{border-top:1px solid rgba(255,200,61,.4)!important;box-shadow:0 0 0 1px rgba(255,200,61,.06),0 24px 48px -28px rgba(0,0,0,.85),0 -10px 40px -20px rgba(255,214,140,.25)}
.clock{box-shadow:0 0 0 4px rgba(255,200,61,.08),0 0 32px rgba(255,200,61,.28)}

/* Wallet coins flying to the header chip */
.flycoin{position:fixed;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-body);color:#6A3A00;background:radial-gradient(circle at 34% 30%,#FFF4C2,#FFC83D 45%,#D98A0B 85%);box-shadow:inset 0 -2px 0 #9A5A05,0 0 14px rgba(255,200,61,.6);z-index:70;pointer-events:none;transition:transform .95s cubic-bezier(.5,0,.2,1),opacity .95s}
#wchip{transition:transform .2s,box-shadow .2s}#wchip.bump{transform:scale(1.08);box-shadow:0 0 0 4px rgba(255,200,61,.3),0 0 24px rgba(255,200,61,.45)}
.tbtn.hot{border-color:rgba(255,200,61,.45);color:var(--gold-txt)}
/* Home: stage lights follow the cursor */
body.homespot .beam,body.homespot #spot{opacity:1}
body.homespot #spot{transition:transform .18s,width .3s,height .3s,opacity .5s}
/* Fastest Finger First */
.fffw{max-width:880px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.fffhead .qtop{align-items:center}
.fffhead .clock{width:64px;height:64px}.fffhead .clock span{font-size:21px}
.fffopts{grid-template-columns:1fr 1fr}
.fffopts .opt .t{font-size:15px;white-space:pre;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tray{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.slots{display:flex;gap:8px}
.slotb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line-2);font:800 18px var(--f-display);color:var(--muted)}
.slotb.filled{border:0;background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink)}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px}
.verdict>div{display:flex;flex-direction:column;gap:4px}
.verdict>div>b{font:800 18px var(--f-display)}
.verdict.good>div>b{color:var(--ok-txt)}.verdict.bad>div>b{color:var(--coral)}
.ordans{color:var(--gold-txt);font-family:var(--f-mono);letter-spacing:.15em}

/* ===== Home landing ===== */
.home3{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:1120px;margin:0 auto;padding-top:min(28vh,240px);text-align:center}
body.no3d .home3{padding-top:32px}
.h-hero{display:flex;flex-direction:column;align-items:center;gap:14px}
.h-hero .ttl{align-items:center}
.h-hero .ttl span{letter-spacing:.55em;padding-left:.55em}
.h-hero .ttl b{font-size:clamp(60px,9vw,116px)}
.h-hero .tag{max-width:58ch}
.h-hero .pill{width:min(560px,100%)}
.h-sub{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.h-sub .hint{margin:0}
.h-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(860px,100%)}
.hc{padding:16px 18px;display:flex;flex-direction:column;gap:3px;text-align:left}
.hc span{font:700 11.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hc b{font:800 26px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--gold-txt);font-variant-numeric:tabular-nums}
.hc small{font-size:13px;color:var(--muted)}
.h-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;padding:0;overflow:hidden;text-align:left}
.h-steps>div{display:flex;gap:14px;align-items:flex-start;padding:18px 20px}
.h-steps>div+div{border-left:1px solid var(--line)}
.h-steps i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-display);font-style:normal;background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--gold-ink)}
.h-steps b{display:block;font:700 15px var(--f-display);margin-bottom:3px}
.h-steps p{margin:0;font-size:13.5px;color:var(--muted)}
.h-ladder{width:100%;display:grid;grid-template-columns:repeat(15,minmax(64px,1fr));gap:6px;overflow-x:auto;padding:2px 2px 6px}
.h-ladder>div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.h-ladder>div.ck{border-color:rgba(255,200,61,.42);background:rgba(255,200,61,.05)}
.h-ladder b{font:700 11px var(--f-mono);color:var(--fg);white-space:nowrap}
.h-ladder em{font:700 9.5px var(--f-body);font-style:normal;color:var(--gold-txt)}
@media (max-width:760px){.h-cards,.h-steps{grid-template-columns:1fr}.h-steps>div+div{border-left:0;border-top:1px solid var(--line)}}

/* ===== Question screen fills the whole screen (full screen / wide monitors) ===== */
body.qscreen .wrap{max-width:none;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body.qscreen .play{grid-template-columns:clamp(190px,13vw,300px) minmax(0,1fr) minmax(320px,26%);gap:clamp(18px,1.6vw,34px)}
.mcol .mascot{width:clamp(170px,11.5vw,270px)!important}
.mcol .say{font-size:clamp(13.5px,.55vw + .4vh,17px)}
body.qscreen .left{min-height:calc(100vh - 96px)}
body.qscreen .mainc{flex:1;justify-content:center;gap:clamp(12px,1.8vh,24px);padding-bottom:4vh}
body.qscreen .qcard{padding:clamp(16px,2vh,28px) clamp(20px,1.8vw,34px)}
body.qscreen .qtext{font-size:clamp(19px,1vw + 1.1vh,36px)}
body.qscreen pre.code{font-size:clamp(14px,.55vw + .65vh,21px)}
body.qscreen .opts{gap:clamp(10px,1.4vh,20px) clamp(10px,1vw,22px)}
body.qscreen .opt{padding:clamp(11px,1.5vh,22px) clamp(28px,2vw,44px)!important}
body.qscreen .opt .t{font-size:clamp(15px,.45vw + .7vh,22px)}
body.qscreen .opt .l{width:clamp(30px,2.2vw,40px);height:clamp(30px,2.2vw,40px)}
body.qscreen .clock{width:clamp(72px,5vw,100px);height:clamp(72px,5vw,100px)}body.qscreen .clock span{font-size:clamp(24px,1.6vw,34px)}
body.qscreen .side .rung{font-size:clamp(15px,.9vw + .3vh,21px)}
body.qscreen header{max-width:none}

/* ===== Byte robot poses: motion per pose ===== */
.fffby{display:flex;align-items:center;gap:16px}
.h-sub .mascot{flex:none}
.mascot svg{overflow:visible}
.mascot.rbot.dance,.mascot.rbot.finish,.mascot.rbot.trophy{animation:hop .6s cubic-bezier(.2,1.4,.4,1) infinite alternate}
.mascot.rbot.run{animation:runbob .26s ease-in-out infinite alternate}
.mascot.rbot.zen{animation:bob 4.2s ease-in-out infinite}
.mascot.rbot.tired,.mascot.rbot.stare{animation:none}
.mascot.rbot .rz,.mascot.rbot .rsteam{transform-box:fill-box;animation:rfloat 1.5s ease-in-out infinite alternate}
.mascot.rbot .rconf{transform-box:fill-box;animation:rconf 1.2s ease-in infinite}
.mascot.rbot .rstars{transform-box:fill-box;transform-origin:center;animation:rspin 2.4s linear infinite}
.mascot.rbot .rspeed{animation:rspeed .3s linear infinite}
@keyframes runbob{to{transform:translateY(-5px)}}
@keyframes rfloat{to{transform:translateY(-5px)}}
@keyframes rconf{from{transform:translateY(-4px);opacity:1}to{transform:translateY(16px);opacity:0}}
@keyframes rspin{to{transform:rotate(360deg)}}
@keyframes rspeed{from{transform:translateX(0);opacity:1}to{transform:translateX(-6px);opacity:.4}}

/* Stage lights come from the studio's own beams; the extra DOM cones are retired */
.beam{display:none!important}
body.homespot #spot{opacity:0!important}
body.qscreen #bg3d{opacity:.75}
/* ===== Home: hero in the centre, big robot at the side ===== */
.home4{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:end;max-width:1400px;margin:0 auto;padding-top:clamp(150px,26vh,250px)}
body.no3d .home4{padding-top:32px}
.h4-bot{display:flex;flex-direction:column;align-items:center;gap:14px;align-self:end}
.h4-bot .mascot{width:clamp(200px,17vw,330px)!important}
.h4-bot .say{text-align:center;max-width:26ch}
.h4-bot .say::before{left:50%;top:auto;bottom:-7px;transform:translateX(-50%) rotate(-45deg)}
.home4 .h-hero{text-align:center}
.h4-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 0;font:600 14px var(--f-body);color:var(--muted)}
.h4-stats span{padding:0 16px}
.h4-stats span+span{border-left:1px solid var(--line-2)}
.h4-stats b{font:800 15px var(--f-display);color:var(--gold-txt)}
@media (max-width:1000px){.home4{grid-template-columns:1fr}.h4-bot{order:2}.h4-bot .mascot{width:180px!important}.home4>.h4-spacer{display:none}}

/* Leg frames: run and dance swap legs every beat */
.mascot.rbot .rfb{opacity:0}
.mascot.rbot.run .rfa{animation:rfa .52s linear infinite}.mascot.rbot.run .rfb{animation:rfb .52s linear infinite}
.mascot.rbot.dance .rfa{animation:rfa 1.2s linear infinite}.mascot.rbot.dance .rfb{animation:rfb 1.2s linear infinite}
@keyframes rfa{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes rfb{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.mascot.rbot .rfa,.mascot.rbot .rfb{animation:none!important}}
/* ===== FFF: robot stands beside the question, not inside it ===== */
.fffgrid{display:grid;grid-template-columns:clamp(170px,15vw,290px) minmax(0,880px) clamp(170px,15vw,290px);justify-content:center;gap:28px;align-items:center}
.fffgrid .fffw{margin:18px 0 0;max-width:none;width:100%}
.fffbot{display:flex;flex-direction:column;align-items:center;gap:14px}
.fffbot .mascot{width:clamp(160px,13vw,260px)!important}
.fffbot .say{text-align:center;max-width:24ch}
.fffbot .say::before{left:50%;top:auto;bottom:-7px;transform:translateX(-50%) rotate(-45deg)}
@media (max-width:1100px){.fffgrid{grid-template-columns:minmax(0,1fr);gap:8px}.fffbot{flex-direction:row-reverse;justify-content:center}.fffbot .mascot{width:110px!important}.fffbot .say::before{display:none}.fffgrid>.fffsp{display:none}}

/* Question screens show nothing but the game */
body.qscreen footer{display:none}

/* ===== Phone & tablet ===== */
.mbtoggle{display:none}

 .mbtoggle{display:inline-flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:61;padding:11px 16px;border-radius:999px;border:1px solid var(--gold);background:rgba(20,16,52,.94);color:var(--gold-txt);font:700 14px var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* ===================== GEN Z SKIN: casual mobile game (sunburst, cream cards, chunky glossy buttons) ===================== */
:root{
  --ink:#2B1A0E; --cream:#FFF7E6; --cream-2:#FFEBC6; --sun-a:#FFB62E; --sun-b:#FF9A1F;
  --pink:#FF4F8B; --teal:#14C3A2; --violet:#7B5CFF; --blue:#2F8CFF;
  --bg:#12100E; --surface:var(--cream); --surface-2:rgba(43,26,14,.07); --raised:#FFFFFF;
  --line:rgba(43,26,14,.16); --line-2:rgba(43,26,14,.3);
  --fg:#F6EEDF; --muted:#B9A98F;
  --gold-txt:#FFB547; --ok-txt:#138A3F; --bad-txt:#D11F3C; --coral:#E8364F;
  --ok:#3DD16F; --ok-ink:#06210F; --bad:#FF5468; --bad-ink:#fff;
  --edge:#2B1A0E; --code-bg:#2B1846; --code-fg:#FFF3DC;
  color-scheme:light;
}
body{background:#12100E;color:var(--fg)}
body::before{background:#12100E}
.aurora{inset:0;background:radial-gradient(ellipse 55% 42% at 50% 8%,rgba(255,170,40,.30),transparent 70%),radial-gradient(ellipse 40% 35% at 92% 96%,rgba(255,79,139,.16),transparent 70%),radial-gradient(ellipse 40% 35% at 4% 70%,rgba(20,195,162,.12),transparent 70%),linear-gradient(180deg,#1A1612,#100E0C)}
.aurora::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,238,210,.13) 1.2px,transparent 1.6px) 0 0/24px 24px;-webkit-mask:radial-gradient(ellipse 80% 70% at 50% 35%,#000 30%,transparent 85%);mask:radial-gradient(ellipse 80% 70% at 50% 35%,#000 30%,transparent 85%)}
.aurora::after{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:42vh;background:linear-gradient(rgba(255,181,71,.10) 1px,transparent 1px) 0 0/100% 38px,linear-gradient(90deg,rgba(255,181,71,.10) 1px,transparent 1px) 0 0/56px 100%;transform:perspective(420px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%)}
.beam,#spot{display:none!important}
body.inplay #bg3d{opacity:.55}
#symfall span{color:rgba(255,214,150,.28)!important;text-shadow:none!important}
::selection{background:var(--pink);color:#fff}

/* header = bubbly pill */
header{background:var(--cream)!important;border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink)!important;backdrop-filter:none!important;border-radius:22px!important}
.brand b{color:var(--ink)!important}.brand b span{color:var(--pink)!important;-webkit-text-fill-color:var(--pink)!important}
.tools .tbtn{color:var(--ink)!important;font-weight:700!important}
.tools .tbtn:hover{background:var(--cream-2)!important}
.tools .tbtn[aria-current],.tools .tbtn.on{background:var(--cream-2)!important}
.tools .tbtn.go{background:linear-gradient(180deg,#FF7AA8,var(--pink) 55%,#E23574)!important;color:#fff!important;border:2.5px solid var(--ink)!important;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.45)!important;border-radius:999px!important}
.tools .tbtn.go:active{transform:translateY(2px)!important;box-shadow:0 1px 0 var(--ink)!important}
#wchip{background:#fff!important;border:2.5px solid var(--ink)!important;border-radius:999px!important;color:var(--ink)!important}
#wchip b{color:var(--ink)!important}
.fire{display:inline-flex;align-items:center;gap:4px;padding:5px 11px 5px 8px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);font:800 13.5px/1 var(--f-display);color:var(--ink);flex:none;cursor:default}
.fire svg{width:18px;height:18px}
.fire.cold svg{filter:grayscale(1);opacity:.5}
.fire.hot svg{animation:flick 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}

/* cards */
body .card,body .panel.card{background:var(--cream)!important;border:3px solid var(--ink)!important;box-shadow:0 6px 0 var(--ink)!important;border-radius:26px}
body .qcard{background:var(--cream)!important;border:3px solid var(--ink)!important;box-shadow:0 7px 0 var(--ink)!important}
.say,.say::before{background:#fff!important;border-color:var(--ink)!important;color:var(--ink)}
.say{border-width:2.5px!important;box-shadow:0 4px 0 var(--ink);font-weight:700}
.say::before{border-width:2.5px!important}
.quip{background:#fff!important;border:2.5px solid var(--ink)!important;border-left:8px solid var(--pink)!important;border-radius:16px!important;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.chip,.hchip{background:#fff!important;border:2px solid var(--ink)!important;color:var(--ink)!important}
.lede,.tag,.hint,.stat2{color:var(--fg)!important}
.muted{color:var(--muted)}
.h-hero .muted,.home4>.muted{color:var(--muted)}

/* title: chunky sticker text */
.ttl span{color:var(--fg)!important;opacity:.8}
.ttl b{filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 8px 0 rgba(43,26,14,.35))}

/* buttons: glossy 3D */
.btn{background:linear-gradient(180deg,#fff,#FFF1D6)!important;color:var(--ink)!important;border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink),inset 0 2px 0 #fff!important;border-radius:18px;transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--ink),inset 0 2px 0 #fff!important}
.btn:active:not(:disabled){transform:translateY(4px)!important;box-shadow:0 1px 0 var(--ink)!important}
.btn.gold{background:linear-gradient(180deg,#FFE680 0%,#FFC52E 48%,#FF9E14 100%)!important;color:var(--ink)!important;box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(194,83,10,.35)!important}
.btn.gold:hover:not(:disabled){box-shadow:0 8px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(194,83,10,.35)!important}
.btn.quiet{background:var(--cream)!important;box-shadow:0 3px 0 var(--ink)!important;border-width:2.5px!important}
.pill{background:#fff!important;border:3px solid var(--ink)!important;box-shadow:0 6px 0 var(--ink)!important;backdrop-filter:none!important}
.pill:has(input.need){border-color:var(--bad)!important}
.pill input{color:var(--ink)!important}.pill input::placeholder{color:var(--muted)!important}

/* hot seat */
.ll .lt{background:#fff!important;border:3px solid var(--ink)!important;box-shadow:0 4px 0 var(--ink)!important;color:var(--ink)}
.ll .cap{color:var(--fg)!important;font-weight:700!important}
.clock{background:conic-gradient(var(--c) calc(var(--p)*360deg),rgba(43,26,14,.15) 0)!important;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)!important}
.clock::before{background:var(--cream)!important;border:2.5px solid var(--ink)}
.clock span{color:var(--ink)}
.clock{--c:var(--teal)}.clock.low{--c:var(--bad)}
.stake small{color:var(--muted)!important}.stake b{color:var(--fg)!important;-webkit-text-fill-color:var(--fg)}
pre.code{border:2.5px solid var(--ink)!important;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.qtext{color:var(--ink)}
.pips i{border-color:var(--ink)}.pips i.on{background:var(--teal);border-color:var(--ink);box-shadow:none}
.ai{background:#fff!important;border:2px dashed var(--ink)!important}

/* answers: candy tiles instead of dark lozenges */
.opts::before{display:none!important}
.opt{clip-path:none!important;background:#fff!important;border:3px solid var(--ink)!important;border-radius:18px!important;box-shadow:0 5px 0 var(--ink)!important;color:var(--ink)!important;transition:transform .12s,box-shadow .12s,background .15s!important;padding:13px 16px!important}
.opt::after{display:none!important}
.opt:hover:not(:disabled){transform:translateY(-3px)!important;box-shadow:0 8px 0 var(--ink)!important;background:var(--cream)!important}
.opt:active:not(:disabled){transform:translateY(4px)!important;box-shadow:0 1px 0 var(--ink)!important}
.opt .l{width:36px!important;height:36px!important;border:2.5px solid var(--ink)!important;color:#fff!important;background:var(--violet);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4);font-weight:800!important}
.opts>.opt:nth-child(4n+1) .l{background:var(--teal)}
.opts>.opt:nth-child(4n+2) .l{background:var(--pink)}
.opts>.opt:nth-child(4n+3) .l{background:var(--violet)}
.opts>.opt:nth-child(4n+4) .l{background:var(--blue)}
.opt.pending{background:#FFF3C4!important}
.opt.locked{background:linear-gradient(180deg,#FFE680,#FFC52E)!important;animation:blink .3s steps(2) infinite}
.opt.right{background:linear-gradient(180deg,#7BEA9F,var(--ok))!important;color:var(--ok-ink)!important;animation:win .7s cubic-bezier(.2,1.5,.3,1)!important}
.opt.wrong{background:linear-gradient(180deg,#FF8494,var(--bad))!important;color:#fff!important;animation:shake .45s}
.opt.locked .l,.opt.right .l,.opt.wrong .l{background:#fff!important;color:var(--ink)!important}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* money board: chunky pills */
.side .board,.board.card{background:var(--cream)!important}
.board h2{color:var(--ink)}
.rung{color:var(--ink)!important;border-radius:999px!important;border:2px solid transparent}

 {id:"G4",c:"C2",name:"Loops",skills:[

 {id:"G5",c:"C2",name:"Strings & lists",skills:[

 {id:"G6",c:"C2",name:"Collections",skills:[

];
const SK={};ROWS.forEach((r,i)=>r.skills.forEach(s=>{s.row=i;SK[s.id]=s}));

/* ================= Variant generators =================
   Each skill × type has a seeded template. Variant .1–.10 is fixed by its seed, so T11.4 is always the same question.
   Every question carries five tags: C, P, G, S, T (+ variant). */
/*GEN-START*/
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function mkR(seed){const r=rng(seed);const R={int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],
 shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
 distinct:(n,a,b)=>{const s=new Set();while(s.size<n)s.add(R.int(a,b));return[...s]}};return R}
const FILLER=["Error","Nothing is printed","None"];
const pyList=a=>`[${a.join(", ")}]`;
const pyTuple=a=>a.length===1?`(${a[0]},)`:`(${a.join(", ")})`;
const pyB=b=>b?"True":"False";
const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:n%10<4?n%10:0]||"th");
const WORDS=["python","coding","garden","rocket","planet","laptop","window","silver","market","bridge"];
function mcq(R,o){const seen=new Set([String(o.ans)]),d=[];for(const x of o.dist.concat(FILLER)){const s=String(x);if(!seen.has(s)){seen.add(s);d.push(s)}if(d.length===3)break}
 const opts=R.shuffle([String(o.ans),...d]);return {kind:"mcq",prompt:o.prompt,code:o.code,opts,ans:opts.indexOf(String(o.ans)),show:String(o.ans),why:o.why,hint:o.hint}}
function fixed(R,o){return {kind:"mcq",prompt:o.prompt,code:o.code,opts:o.opts,ans:o.ans,show:o.opts[o.ans],why:o.why,hint:o.hint,plain:true}}
function vsai(R,o){return {kind:"mcq",prompt:"Is the AI right?",code:o.code,ai:o.says,opts:["The AI is right","The AI is wrong"],ans:o.right?0:1,show:o.right?"The AI is right":"The AI is wrong",why:o.why,hint:o.hint,plain:true,two:true}}
function fill(o){return {kind:"fill",prompt:o.prompt,code:o.code,acc:o.acc,show:o.show,why:o.why,hint:o.hint}}
function match(R,o){const choices=o.choices?R.shuffle(o.choices):R.shuffle([...new Set(o.items.map(i=>i.ans))]);return {kind:"match",prompt:o.prompt,code:o.code,items:o.items,choices,why:o.why,hint:o.hint,show:o.items.map(i=>i.ans).join(" · ")}}
function order(R,o){const n=o.lines.length;let p;do{p=R.shuffle([...Array(n).keys()])}while(p.every((v,i)=>v===i));return {kind:"order",prompt:o.prompt,lines:o.lines,disp:p,why:o.why,hint:o.hint,show:o.lines.join("\n")}}
function makePw(R){const U="ABDEGHKMPRT",L="acehkmnprstw",D="23456789";const a=[R.pick(U),R.pick(L),R.pick(D),R.pick(U),R.pick(L),R.pick(D),R.pick(L)].slice(0,R.int(5,7));return R.shuffle(a).join("")}
const isU=c=>/[A-Z]/.test(c),isD=c=>/[0-9]/.test(c),isL=c=>/[a-z]/.test(c);

const GEN={
"G1a|T1":R=>{const a=R.int(2,9),b=R.int(2,9),c=R.int(2,4),ans=(a+b)*c;
 return mcq(R,{prompt:"What does this print?",code:`n = ${a}\nn = n + ${b}\nn = n * ${c}\nprint(n)`,ans,dist:[a+b*c,a*c,a+b,"n"],
 why:`n starts as ${a}. Line 2 makes it ${a} + ${b} = ${a+b}. Line 3 multiplies that by ${c}, giving ${ans}. Each line uses the value n holds at that moment.`,hint:"Go line by line. A variable keeps only its latest value."})},
"G1a|T2":R=>{const [x,y]=R.distinct(2,1,9);
 if(R.int(0,1))return mcq(R,{prompt:"What does this print?",code:`x = ${x}\ny = ${y}\nx = y\ny = x\nprint(x, y)`,ans:`${y} ${y}`,dist:[`${y} ${x}`,`${x} ${y}`,`${x} ${x}`],why:`Line 3 copies y into x, so x is ${y}. Line 4 copies x (already ${y}) back into y. The old ${x} is gone, so both print ${y}.`,hint:"Line 3 overwrites x before line 4 runs."});
 return mcq(R,{prompt:"What does this print?",code:`a = ${x}\nb = a\na = a + 1\nprint(a, b)`,ans:`${x+1} ${x}`,dist:[`${x+1} ${x+1}`,`${x} ${x}`,`${x} ${x+1}`],why:`b = a copies the value ${x} into b. Changing a afterwards does not change b, so a is ${x+1} and b stays ${x}.`,hint:"b got a copy of the number, not a link to a."})},
"G1b|T1":R=>{const v=R.int(10,99);const C=[[`"${v}"`,"str","Quotes make it a string, even when it looks like a number."],[`${v}`,"int","A whole number without quotes is an int."],[`${v}.0`,"float","A number with a decimal point is a float."],["True","bool","True and False, without quotes, are booleans."],[`"True"`,"str","Inside quotes, True is just text, so it is a string."],[`${v} / 1`,"float","/ always gives a float in Python 3, even when it divides evenly."],[`${v} // 2`,"int","// is integer division. Two ints give an int."]];const [e,t,w]=R.pick(C);
 return mcq(R,{prompt:"What does this print?",code:`print(type(${e}))`,ans:`<class '${t}'>`,dist:["str","int","float","bool"].filter(x=>x!==t).map(x=>`<class '${x}'>`),why:w,hint:"Look for quotes, a decimal point or a division sign."})},
"G1b|T3":R=>{const b=R.int(2,9);
 if(R.int(0,1)){const a=R.int(10,40);return fill({prompt:`Fill the blank so this prints ${a+b}.`,code:`x = "${a}"\ny = ${b}\nprint(____(x) + y)`,acc:["int"],show:"int",why:`x holds the text "${a}". int(x) turns it into the number ${a}, so ${a} + ${b} = ${a+b}. float(x) would print ${a+b}.0 instead.`,hint:"Turn the text into a whole number first."})}
 const w=R.pick(["Room","Level","Team","Gate"]);return fill({prompt:`Fill the blank so this prints ${w}${b}.`,code:`x = "${w}"\ny = ${b}\nprint(x + ____(y))`,acc:["str"],show:"str",why:`You can't add text and a number. str(y) turns ${b} into the text "${b}", and + joins the two strings into ${w}${b}.`,hint:"Both sides of + must be text to join them."})},
"G1c|T2":R=>{const b=R.int(3,9);let a=R.int(13,59);if(a%b===0)a++;const r=a%b,q=Math.floor(a/b);
 return mcq(R,{prompt:"What does this print?",code:`print(${a} % ${b}, ${a} // ${b})`,ans:`${r} ${q}`,dist:[`${q} ${r}`,`${r} ${(a/b).toFixed(2)}`,`${r+1} ${q}`,`${r} ${q+1}`],why:`${b} fits into ${a} ${q} whole times (${b} × ${q} = ${b*q}). // gives that whole part, ${q}. % gives what is left over: ${a} − ${b*q} = ${r}.`,hint:"% is the remainder, // is the whole part."})},
"G1c|T5":R=>{const a=R.int(2,9),b=R.int(2,6),c=R.int(2,4),d=R.int(3,5),v=[a,a+b,(a+b)*c,Math.floor((a+b)*c/d)],L=R.int(3,4);
 return mcq(R,{prompt:`What is the value of x after line ${L} runs?`,code:`x = ${a}\nx += ${b}\nx *= ${c}\nx //= ${d}`,ans:v[L-1],dist:L===3?[v[1],v[3],a+b*c,v[2]+c]:[v[2],((a+b)*c/d).toFixed(1),v[3]+1,v[1]],
 why:`Line 1: x = ${a}. Line 2: x = ${a} + ${b} = ${v[1]}. Line 3: x = ${v[1]} × ${c} = ${v[2]}.`+(L===4?` Line 4: x = ${v[2]} // ${d} = ${v[3]}, keeping only the whole part.`:""),hint:"x += b means x = x + b. Do one line at a time."})},
"G2a|T1":R=>{const [A,B]=R.shuffle(["Hi","Code","Py","Go","Win","Run"]).slice(0,2);
 if(R.int(0,1)){const s=R.pick(["-","",", ","*"]);return mcq(R,{prompt:"What does this print?",code:`print("${A}", "${B}", sep="${s}")`,ans:A+s+B,dist:[A+" "+B,A+" "+s+" "+B,A+B,A+s+B+s],why:`sep sets what goes between the items. Here it is "${s}"${s===""?", which is nothing at all,":""} so you get ${A+s+B}. Without sep, print puts one space between items.`,hint:"sep replaces the space print puts between items."})}
 const e=R.pick(["!","...","?"]);return mcq(R,{prompt:"What does this print? Line breaks are shown as new lines.",code:`print("${A}", end="${e}")\nprint("${B}")`,ans:A+e+B,dist:[A+"\n"+B,A+e+"\n"+B,A+" "+B,A+B],why:`end replaces the new line print normally adds. The first print ends with "${e}" and stays on the same line, so the second print carries on from there: ${A+e+B}.`,hint:"Normally print ends with a new line. end changes that."})},
"G2a|T4":R=>{const [A,B]=R.shuffle(["hi","code","py","go","win"]).slice(0,2);
 const pool=[[`print("${A}", "${B}")`,`${A} ${B}`],[`print("${A}", "${B}", sep="")`,`${A}${B}`],[`print("${A}", "${B}", sep="-")`,`${A}-${B}`],[`print("${A}", end="!")`,`${A}!`]];
 return match(R,{prompt:"Match each line of code to what it prints.",items:R.shuffle(pool).slice(0,3).map(([c,o])=>({label:c,ans:o})),why:"print puts one space between items by default. sep changes that separator, and end changes what comes after the last item.",hint:"Check sep and end in each line."})},

 return mcq(R,{prompt:"What does this print?",code:`s = "${w}"\nprint(s[${i}], len(s))`,ans:`${w[i]} ${n}`,dist:[`${w[i-1]} ${n}`,`${w[i+1]} ${n}`,`${w[i]} ${n-1}`,`${w[i-1]} ${n-1}`],why:`Indexes start at 0, so s[${i}] is the ${ord(i+1)} letter: ${w[i]}. len counts every character: ${n}.`,hint:"The first character is s[0]."})},
"G2b|T6":R=>{const w=R.pick(WORDS),n=w.length;const ops=[["s[-1]",w[n-1],w[n-2],"Negative indexes count from the end, and -1 is the last character."],["s[1:4]",w.slice(1,4),w.slice(1,5),"A slice stops before its end index, so you get indexes 1, 2 and 3."],["s[:3]",w.slice(0,3),w.slice(0,4),"s[:3] takes indexes 0, 1 and 2."],["len(s) - 1",String(n-1),String(n),`len(s) is ${n}, and 1 less is ${n-1}.`],["s[2] + s[0]",w[2]+w[0],w[1]+w[0],"s[2] is the third character, and + joins the two strings."]];
 const [e,t,wr,d]=R.pick(ops),right=R.int(0,1)===1;

"G2c|T1":R=>{const [a,b]=R.distinct(2,2,9),m=R.int(0,2);
 if(m===0)return mcq(R,{prompt:`The user types ${a}, then ${b}. What does this print?`,code:`a = input()\nb = input()\nprint(a + b)`,ans:`${a}${b}`,dist:[a+b,"Error",`${a} ${b}`],why:`input() always gives text. "${a}" + "${b}" joins the two strings, so it prints ${a}${b}, not ${a+b}.`,hint:"What type does input() give back?"});

 return mcq(R,{prompt:`The user types ${a}. What does this print?`,code:`n = input()\nprint(n * 2)`,ans:`${a}${a}`,dist:[a*2,"Error",`${a} ${a}`],why:`n is the text "${a}". Multiplying a string by 2 repeats it: ${a}${a}.`,hint:"input() gives a string. What does * do to a string?"})},

/* Satire desk: one quip per page, rotating every minute (and per question on the hot seat). */
const QUOTES=[

/* Explanations: the key idea and the classic trap for every skill, shown under the step-by-step working. */
const EXPLAIN={
 G1a:{idea:"A variable is a label on a value. x = y copies the value y has right now; later changes to y don't reach x.",trap:"Reading x = y as \"x and y are now linked\". They aren't: each line uses the values as they are at that moment."},
 G1b:{idea:"Every value has a type: int (whole number), float (has a decimal point), str (in quotes), bool (True/False). Quotes win: \"5\" is text.",trap:"Thinking 5.0 is an int, or that \"65\" is a number because it looks like one."},
 G1c:{idea:"// is whole-number division (how many times it fits) and % is the remainder (what's left). a == b * (a // b) + a % b.",trap:"Swapping // and %, or using / which always gives a float like 5.11."},
 G2a:{idea:"print puts sep between items (a space by default) and end after the last one (a new line by default).",trap:"Forgetting that end=\"!\" replaces the new line, so the next print continues on the same line."},
 G2b:{idea:"Indexes start at 0, so s[0] is the first character and s[len(s) - 1] is the last. len counts every character.",trap:"Counting from 1, which gives the character one place to the right."},
 G2c:{idea:"input() always returns text. Use int(...) to turn it into a number before doing maths.",trap:"Adding two inputs and expecting a sum: \"3\" + \"4\" joins text into \"34\"."},
 G3a:{idea:"and needs both sides True; or needs at least one; not flips. Comparisons (<, >, ==) give True or False.",trap:"Reading \"x > 3 and x < 8\" loosely. Check each side separately, then combine."},
 G3b:{idea:"Python checks if, then each elif from top to bottom, and runs only the first branch whose test is True.",trap:"Thinking several branches can run. Once one matches, the rest are skipped."},
 G3c:{idea:"An inner if only runs when the outer if was True. Follow the indentation to see which block you are in.",trap:"Checking the inner condition when the outer one already failed."},
 G4a:{idea:"range(start, stop, step) starts at start, moves by step and stops before stop.",trap:"Including the stop value. range(1, 5) gives 1, 2, 3, 4."},
 G4b:{idea:"A while loop re-checks its condition before every round and stops the first time it is False.",trap:"Forgetting that the loop variable must change, or that the check happens before the body."},
 G4c:{idea:"A counter or total starts before the loop and is updated inside it, once per round.",trap:"Putting total = 0 inside the loop (it resets every round) or printing inside the loop."},
 G5a:{idea:"for ch in text visits each character in order, one per round.",trap:"Miscounting repeated letters. Write the characters out and tick them off."},
 G5b:{idea:"append adds to the end, nums[-1] is the last item, and nums[a:b] slices from a up to (not including) b.",trap:"Including index b in a slice, or writing nums = nums.append(x), which stores None."},
 G5c:{idea:"for n in nums visits each item. Compare or add as you go, keeping a running result.",trap:"Starting a \"largest\" search at 0 when every number is negative."},
 G6a:{idea:"A tuple is a fixed sequence: you can read and unpack it, but not change it.",trap:"Trying t[0] = ... or t.append(...). Building a new tuple with + is fine."},
 G6b:{idea:"A dict maps keys to values. d[key] reads a value; d.get(key, default) is safe when the key may be missing.",trap:"Reading a key that isn't there with d[key], which raises KeyError."},
 G6c:{idea:"A set keeps one copy of each value and has no order. len(set(nums)) counts the distinct values.",trap:"Counting duplicates, or expecting a set to keep the original order."}};

function stepHTML(t,q){const m=/\b[Ll]ine (\d+)\b/.exec(t),lines=q&&q.code?q.code.split("\n"):[];const L=m&&lines[+m[1]-1];

function explainHTML(q,ok){const s=SK[q.sk],X=EXPLAIN[q.sk]||{},steps=whySteps(q.why);
 const picked=q.kind==="mcq"&&S.pick!=null&&q.opts?q.opts[S.pick]:null;
 return `<div class="panel card explain ${ok?"good":"bad"}"><h3>${ICON.why}${ok?"Why it works":S.timeout?"Time ran out. Here's the working":"Here's the working, step by step"}</h3>
<div class="ex-ans"><div class="ok"><span>Correct answer</span><code>${esc(q.show).replace(/\n/g,"<br>")}</code></div>${!ok&&picked!=null?`<div class="no"><span>You picked</span><code>${esc(picked)}</code></div>`:""}</div>
${codeWalk(q.code)}${steps.length?`<h4 class="ex-h">Work it out</h4><ol class="ex-steps">${steps.map(t=>`<li>${stepHTML(t,q)}</li>`).join("")}</ol>`:""}
${X.idea?`<div class="ex-note idea"><b>Key idea</b><p>${esc(X.idea)}</p></div>`:""}
${X.trap?`<div class="ex-note trap"><b>${ok?"Watch out next time":"Common trap"}</b><p>${esc(X.trap)}</p></div>`:""}</div>`}
/* "Read the code": what each line does, in plain words (descriptive only; the worked steps below give the values) */
function lineRole(raw){const t=raw.trim();let m;
 if(!t)return null;
 if(m=/^for (\w+(?:, \w+)?) in range\((.*)\):$/.exec(t))return `Loop: ${m[1]} takes each number from range(${m[2]}), stopping before the end value. The indented lines run once per number.`;
 if(m=/^for (\w+) in (.+):$/.exec(t))return `Loop: ${m[1]} takes each item of ${m[2]} in turn. The indented lines run once per item.`;

 else if(/^if\b/.test(t))why=ind?"Inside the loop: check the condition and act on it.":"Check the condition.";
 else if(/^print\(/.test(t))why=ind?"Inside the loop, so it prints every round.":"Print the result. It sits after the setup and any loop, so it runs once with the final value.";
 else if(/=/.test(t)&&!/==/.test(t.split("=")[0]))why=ind?"Inside the loop: update the value every round.":i===0?"Set up the starting value first, so later lines can use it.":"Create or update a value using what came before.";

 else why=ind?"Inside the loop: runs once per round.":"Runs in order after the line above.";
 out.push(`<li><code class="ex-line">${esc(l.replace(/^ {4}/,"→ "))}</code><span>${why}</span></li>`)});return `<ol class="ex-steps">${out.join("")}</ol>`}

  S.mapTop=scrollY;S.openCk=null;S.open=S.open===sk?null:sk;render();return}
 if(a==="buddy")return;
 if(a==="guide"||a==="wallet"||a==="path"){if(S.screen==="play")endRun("stop");S={screen:a,name:S.name};render();scrollTo({top:0});return}
 if(a==="pick-char"&&COSTUMES[b.dataset.c]){CHAR=b.dataset.c;store.set("kbc-r2-char",CHAR);SFX.pick();ROBO.hello();logEv({kind:"buddy",c:CHAR});render();return}
 if(a==="fs"){toggleFull();return}
 if(a==="sound"){soundOn=!soundOn;store.set("kbc-r1-snd",soundOn);syncSound();if(soundOn){ctx();SFX.pick();VIBE_UNTIL=Date.now()+60000;if(S.screen==="home")render()}return}
 if(a==="hp"){const el=$("#pname");if(el)S.name=el.value.trim();S.hp=S.hp===b.dataset.p?"":b.dataset.p;render();return}
 if(a==="play"||a==="fffgo"){goPlay("fff");return}
 if(a==="seat"){goPlay("seat");return}
 if(a==="practice"){startPractice();return}
 if(a==="hotseat"){startRun(true);return}
 if(a==="fff-next"){startFFF(S.fff?S.fff.idx+1:null);return}
 if(a==="collect"){endRun("win");return}
 if(S.screen!=="play")return;
 if(a==="pick"&&S.phase==="ask"){S.pick=+b.dataset.i;S.quitAsk=false;SFX.pick();document.querySelectorAll(".opt").forEach(o=>o.className=optCls(+o.dataset.i));syncAct();return}
 if(a==="unpick"){S.pick=null;document.querySelectorAll(".opt").forEach(o=>o.className=optCls(+o.dataset.i));syncAct();return}
 if(a==="ord"&&S.phase==="ask"){const d=+b.dataset.d;if(!S.ord.includes(d)){S.ord.push(d);SFX.pick();const y=scrollY;render();scrollTo({top:y})}return}
 if(a==="ord-clear"){S.ord=[];const y=scrollY;render();scrollTo({top:y});return}
 if(a==="msel"&&S.phase==="ask"){S.msel[+b.dataset.i]=b.dataset.c;SFX.pick();const y=scrollY;render();scrollTo({top:y});return}
 if(a==="lock"){if(ready())lockIn();return}
 if(a==="quit-ask"){S.quitAsk=true;syncAct();return}
 if(a==="quit-no"){S.quitAsk=false;syncAct();return}
 if(a==="quit"){endRun("stop");return}
 if(a==="next"){leaveReveal();newQ();render();scrollTo({top:0});return}
 if(a==="second"&&S.screen==="play"){logEv({kind:"retry",rung:rungOf()});leaveReveal();newQ();render();scrollTo({top:0});say("New variant of the same question.");return}
 if(a==="practice-end"&&S.practice){leaveReveal();logEv({kind:"practice_end",answered:S.run.answered,correct:S.run.correct});S={screen:"home",name:S.name};render();scrollTo({top:0});return}
 if(a==="board"){document.body.classList.toggle("boardopen");return}
 if(a==="stop"){endRun("stop");return}
 if(a==="end"){endRun(S.run&&S.run.en<=0?"energy":S.timeout?"timeout":"wrong");return}
 if(a==="ll"){const k=b.dataset.k;if(S.used[k]||S.phase!=="ask")return;S.used[k]=true;
  if(k==="fifty"){const q=S.q;S.gone=shuf([0,1,2,3].filter(i=>i!==q.ans)).slice(0,2);if(S.gone.includes(S.pick))S.pick=null}
  if(k==="hint")S.hint=true;
  if(k==="flip"){const sk=S.q.sk,q=serve(sk,S.practice);saveP();Object.assign(S,{q,pick:null,gone:[],hint:false,fill:"",ord:[],msel:q.kind==="match"?q.items.map(()=>""):[],time:S.secsMax||CFG.secs,deadline:0,qT0:Date.now()})}
  logEv({kind:"lifeline",life:k,sk:S.q.sk,ty:S.q.ty});SFX.pick();const y=scrollY;render();scrollTo({top:y});return}
},SIG);
document.addEventListener("input",e=>{if(e.target.id==="pname"){e.target.classList.remove("need");return}
 if(e.target.id==="fillin"&&S.screen==="play"){S.fill=e.target.value;syncAct()}},SIG);
document.addEventListener("change",e=>{if(e.target.id==="fameuni"){loadFame("uni",e.target.value);return}if(e.target.matches(".mrow select")&&S.screen==="play"){S.msel[+e.target.dataset.i]=e.target.value;syncAct()}},SIG);
document.addEventListener("keydown",e=>{
 if(S.screen!=="play")return;
 if(e.key==="Enter"){if(e.target.id==="fillin"||!e.target.matches("input,select,button")){const btn=$("#lockbtn")||$('[data-act="next"]')||$('[data-act="second"]')||$('[data-act="end"]');if(btn){e.preventDefault();btn.click()}}return}
 if(e.target.matches("input,select"))return;const i="abcd".indexOf(e.key.toLowerCase());
 if(i>-1&&S.q.kind==="mcq"&&S.phase==="ask"&&i<S.q.opts.length&&!S.gone.includes(i)){S.pick=i;SFX.pick();document.querySelectorAll(".opt").forEach(o=>o.className=optCls(+o.dataset.i));syncAct()}},SIG);
/* Leaving the tab mid-question is recorded (the clock keeps running on wall time either way) */
document.addEventListener("visibilitychange",()=>{if(!document.hidden)return;if(S.screen==="play"&&S.phase==="ask")S.away=(S.away||0)+1;if(S.screen==="fff"&&S.fff&&!S.fff.done)S.fff.away=(S.fff.away||0)+1},SIG);

function syncSound(){const b=$("#soundbtn");if(b){b.setAttribute("aria-pressed",soundOn);const l=b.querySelector(".lbl");if(l)l.textContent=soundOn?"Sound on":"Sound off"}}
syncSound();addEventListener("pointerdown",()=>{if(soundOn)ctx()},SIG);
render();boot();
})();
</script>
</body>
</html>
